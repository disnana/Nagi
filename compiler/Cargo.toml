[package]
name = "nagic"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sql-check"]
sql-check = ["dep:rusqlite"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde", "display"] }
unicode-ident = "1.0"
rusqlite = { version = "0.40", optional = true, features = ["bundled", "hooks", "limits"] }

[[example]]
name = "fuzz-smoke"
path = "../fuzz/smoke.rs"
