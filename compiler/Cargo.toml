[package]
name = "nagic"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["sql-check"]
sql-check = ["dep:rusqlite"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde", "display"] }
unicode-ident = "1.0"
sha2 = "=0.10.9"
rusqlite = { version = "0.40", optional = true, features = ["bundled", "hooks", "limits"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[[example]]
name = "fuzz-smoke"
path = "../fuzz/smoke.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nagi_sf01_diagnostic)', 'cfg(nagi_sf01_diag_oracle)', 'cfg(nagi_editor_stage_diag)'] }
