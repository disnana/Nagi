[package]
name = "nagi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
bumpalo = "3.20"
futures-util = "0.3"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util"] }
