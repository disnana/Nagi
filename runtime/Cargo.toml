[package]
name = "nagi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
bumpalo = "3.20"
futures-util = "0.3"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
matchit = "0.8.4"

# D3 Session primitives; JWT verification dependencies are a separate milestone.
getrandom = "=0.3.4"
base64 = "=0.22.1"
sha2 = "=0.10.9"
cookie = { version = "=0.18.2", default-features = false }

# SF04 development adoption: exact reviewed URL/compiled ICU data graph.
url = { version = "=2.5.8", default-features = true }

# SF03 fixed digest equality; direct feature/profile adoption awaits normal Cargo.
subtle = { version = "=2.6.1", default-features = false }

# G3 candidate: exact reviewed JWT11 AWS-LC backend.
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "=1.18.1"

# SF06 private TLS dependency candidate. Runtime implementation remains unconnected.
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
webpki-roots = { version = "=1.0.9", default-features = false }

# SF06 private tracked DNS provider; runtime API remains unconnected.
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util", "test-util"] }
rcgen = { version = "=0.14.2", default-features = false, features = ["aws_lc_rs"] }

# Candidate private native-main witness; official cached binding, no raw API.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# The observer is a closed test-only cfg, not a public Cargo feature.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nagi_auth_stage_diag)", "cfg(nagi_browser_login_diag)"] }
