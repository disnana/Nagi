[package]
name = "nagi-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
bumpalo = "3.20"
futures-util = "0.3"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
matchit = "0.8.4"

# D3 Session primitives; JWT verification dependencies are a separate milestone.
getrandom = "=0.3.4"
base64 = "=0.22.1"
sha2 = "=0.10.9"
cookie = { version = "=0.18.2", default-features = false }

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util", "test-util"] }
