[package]
name = "nagi-runtime"
version = "0.1.11"
edition = "2021"
license = "MIT"
[dependencies]
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
deadpool = { version = "=0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
bumpalo = "3.20"
futures-util = "0.3"
hyper = { version = "1.11", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
matchit = "0.8.4"

[workspace]
