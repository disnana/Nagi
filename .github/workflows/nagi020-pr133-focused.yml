name: PR133 focused native and browser diagnostics

on:
  push:
    branches:
      - test/nagi020-pr133-ci-repair-20261019

permissions:
  contents: read

concurrency:
  group: pr133-focused-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collector-controls:
    if: github.ref == 'refs/heads/test/nagi020-pr133-ci-repair-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the updated collector and 37 mutation controls first
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          controls = (
              ("browser_login_collector", 21,
               [sys.executable, "-B", "-m", "unittest", "discover", "-s", "tests",
                "-p", "test_browser_login_phase_diagnostic.py"]),
              ("csrf_mutations", 37,
               [sys.executable, "-B", "scripts/tests/test_csrf_deadline_mutations.py"]),
          )
          failed = False
          for name, expected, command in controls:
              process = subprocess.Popen(command, stdout=subprocess.PIPE,
                                         stderr=subprocess.STDOUT)
              retained = bytearray()
              oversized = False
              assert process.stdout is not None
              while chunk := process.stdout.read(8192):
                  available = max(0, 65537 - len(retained))
                  retained.extend(chunk[:available])
                  oversized |= len(chunk) > available
              code = process.wait()
              try:
                  text = bytes(retained).decode("utf-8", errors="strict")
              except UnicodeError:
                  text = ""
                  oversized = True
              ran = re.findall(r"(?m)^Ran ([0-9]+) tests? in [0-9.]+s$", text)
              ok = (not oversized and code == 0 and ran == [str(expected)]
                    and "\nOK\n" in "\n" + text.replace("\r\n", "\n"))
              print(f"pr133_control name={name} status={'passed' if ok else 'failed'} "
                    f"tests={ran[0] if len(ran) == 1 else 'unavailable'} exit={code}")
              failed |= not ok
          raise SystemExit(1 if failed else 0)
          PY

  focused-native:
    needs: collector-controls
    if: github.ref == 'refs/heads/test/nagi020-pr133-ci-repair-20261019'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Cache the target platform's Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, list, and run all focused native cases with closed summaries
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          ROOT = pathlib.Path.cwd()
          OUT = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pr133-focused"
          OUT.mkdir(parents=True, exist_ok=True)
          RAW_LIMIT = 1024 * 1024
          BRANCH = "test/nagi020-pr133-ci-repair-20261019"

          HTTP_CASES = {
              "managed_values": (
                  "http_server::finalizer_tests::managed_values_are_reasserted_from_owned_representation",
                  ("runtime/src/http_server/finalizer_tests.rs",)),
              "ordinary_framing": (
                  "http_server::tests::ordinary_response_framing_uses_the_native_body_length_without_allocating_a_header_value",
                  ("runtime/src/http_server/tests.rs",)),
              "length_413": (
                  "http_server::tests::oversized_body_content_length_delivers_413_without_calling_handler",
                  ("runtime/src/http_server/tests.rs",)),
              "chunked_413": (
                  "http_server::tests::oversized_body_chunked_delivers_413_with_or_without_final_chunk",
                  ("runtime/src/http_server/tests.rs",)),
              "constructor_panic": (
                  "http_server::tests::panic_tests::http_handler_constructor_panic_returns_500",
                  ("runtime/src/http_server/tests.rs", "runtime/src/http_server/panic_tests.rs")),
              "request_capacity": (
                  "http_server::tests::request_capacity_rejects_unread_bodies_then_releases_admission",
                  ("runtime/src/http_server/tests.rs",)),
          }
          BRIDGE_CASES = frozenset(
              "auth::session::http_bridge::tests::" + name for name in (
                  "bearer_success_is_no_store",
                  "bearer_body_rejection_is_no_store",
                  "session_real_lookup_binds_request_and_classifies_all_credentials",
                  "session_authorizer_receives_real_metadata_and_foreign_grant_is_refused",
                  "session_deferred_touch_wait_spends_handler_budget_before_business_error",
                  "session_head_mapper_panic_timeout_and_304_use_managed_finalizer",
                  "session_bad_host_precedes_closed_pool_lookup_and_cookie_bounds_are_finite",
              )
          )
          DELIVERY_CASE = (
              "auth::session::http_bridge::delivery_tests::"
              "applied_304_and_private_cache_conflict_are_fixed_no_cookie_500"
          )
          BROWSER_CASE = "committed_claim_stays_consumed_on_verifier_error_panic_and_deadline"
          LIST_EXPECTED = frozenset(
              [case[0] for case in HTTP_CASES.values()] + list(BRIDGE_CASES)
              + [DELIVERY_CASE]
          )
          ROW = re.compile(r"(?m)^test ([A-Za-z_][A-Za-z0-9_:]*) \.\.\. (ok|FAILED|ignored)$")
          SUMMARY = re.compile(
              r"(?m)^test result: (ok|FAILED)\. ([0-9]+) passed; ([0-9]+) failed; "
              r"([0-9]+) ignored; [0-9]+ measured; [0-9]+ filtered out; "
              r"finished in [0-9.]+s$"
          )
          RUNNING = re.compile(r"(?m)^running ([0-9]+) tests?$" )
          FOOTER = re.compile(r"(?m)^([0-9]+) tests, 0 benchmarks$")
          PANIC = re.compile(
              r"^thread '([^'\r\n]{1,256})'(?: \([0-9]{1,20}\))? panicked at "
              r"(.{1,512}\.rs):([0-9]{1,6}):([0-9]{1,5}):"
          )
          KNOWN_SOURCES = frozenset({
              "runtime/src/http_server.rs",
              "runtime/src/http_server/tests.rs",
              "runtime/src/http_server/finalizer_tests.rs",
              "runtime/src/http_server/panic_tests.rs",
              "runtime/src/auth/session/http_bridge_tests.rs",
              "runtime/src/auth/session/delivery_wire_tests.rs",
              "runtime/tests/browser_login_public_api.rs",
              "runtime/src/auth/browser_login_observer.rs",
          })

          sys.path.insert(0, str(ROOT / "scripts/ci"))
          import browser_login_phase_diagnostic as browser_collector

          def run(command: list[str], *, cfg: bool = False) -> tuple[bytes, int, bool]:
              env = os.environ.copy()
              env["CARGO_TERM_COLOR"] = "never"
              if cfg:
                  env["RUSTFLAGS"] = "--cfg nagi_auth_stage_diag --cfg nagi_browser_login_diag"
              process = subprocess.Popen(command, stdout=subprocess.PIPE,
                                         stderr=subprocess.STDOUT, env=env)
              retained = bytearray()
              oversized = False
              assert process.stdout is not None
              while chunk := process.stdout.read(8192):
                  available = max(0, RAW_LIMIT + 1 - len(retained))
                  retained.extend(chunk[:available])
                  oversized |= len(chunk) > available
              return bytes(retained), process.wait(), oversized

          def record(name: str, value: dict) -> None:
              (OUT / (name + ".json")).write_text(
                  json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="ascii",
              )
              print("pr133_native " + " ".join(
                  f"{key}={value[key]}" for key in ("case", "status", "cargo_exit")
                  if key in value
              ))

          def text_input(raw: bytes, oversized: bool) -> str | None:
              if oversized or len(raw) > RAW_LIMIT or b"\x1b" in raw or b"\x00" in raw:
                  return None
              try:
                  text = raw.decode("utf-8", errors="strict").replace("\r\n", "\n")
              except UnicodeError:
                  return None
              return None if "\r" in text else text

          def source_positions(raw_text: str, expected_names: frozenset[str], allowed: frozenset[str]) -> list[dict]:
              found = []
              for line in raw_text.splitlines():
                  match = PANIC.fullmatch(line)
                  if match is None:
                      continue
                  thread, raw_path, raw_line, raw_column = match.groups()
                  source = raw_path.replace("\\", "/")
                  source = next((candidate for candidate in allowed
                                 if source == candidate or source.endswith("/" + candidate)), None)
                  if thread not in expected_names or source is None or source not in KNOWN_SOURCES:
                      continue
                  number, column = int(raw_line), int(raw_column)
                  if not (1 <= number <= 100000 and 1 <= column <= 9999):
                      continue
                  item = {"test": thread, "source": source, "line": number, "column": column}
                  if item not in found:
                      found.append(item)
                  if len(found) >= 16:
                      break
              return found

          def test_summary(case: str, raw: bytes, cargo_exit: int, oversized: bool,
                          expected: frozenset[str], allowed: frozenset[str]) -> dict:
              data = {"case": case, "cargo_exit": cargo_exit, "status": "invalid",
                      "tests": [], "positions": [], "summary": None}
              text = text_input(raw, oversized)
              if text is None:
                  return data
              rows = ROW.findall(text)
              summaries = SUMMARY.findall(text)
              running = RUNNING.findall(text)
              if (len(summaries) != 1 or len(running) != 1
                      or int(running[0]) != len(expected)
                      or len(rows) != len(expected)
                      or {name for name, _ in rows} != expected
                      or len({name for name, _ in rows}) != len(rows)):
                  return data
              kind, passed, failed, ignored = summaries[0]
              counts = {"passed": int(passed), "failed": int(failed), "ignored": int(ignored)}
              observed = {"ok": 0, "FAILED": 0, "ignored": 0}
              for _, result in rows:
                  observed[result] += 1
              if observed != {"ok": counts["passed"], "FAILED": counts["failed"],
                              "ignored": counts["ignored"]}:
                  return data
              success = kind == "ok" and counts == {"passed": len(expected), "failed": 0, "ignored": 0} and cargo_exit == 0
              failed_run = kind == "FAILED" and counts["failed"] > 0 and cargo_exit != 0
              if not (success or failed_run):
                  return data
              data.update(status="passed" if success else "tests_failed",
                          tests=[{"name": name, "result": result}
                                 for name, result in sorted(rows) if name in expected],
                          positions=source_positions(text, expected, allowed),
                          summary={"outcome": kind, **counts})
              return data

          def command_record(case: str, raw: bytes, cargo_exit: int, oversized: bool) -> dict:
              text = text_input(raw, oversized)
              return {"case": case, "cargo_exit": cargo_exit,
                      "status": "passed" if text is not None and cargo_exit == 0 else "failed",
                      "output_bounded": text is not None}

          overall_failed = False
          base = ["cargo", "test", "--locked", "-p", "nagi-runtime"]

          raw, code, too_large = run(base + ["--lib", "--no-run"])
          result = command_record("compile_lib", raw, code, too_large)
          record("compile_lib", result)
          overall_failed |= result["status"] != "passed"

          raw, code, too_large = run(base + ["--lib", "--", "--list"])
          listing = text_input(raw, too_large)
          actual_list = [] if listing is None else [
              line.removesuffix(": test") for line in listing.splitlines()
              if line.endswith(": test") and line.removesuffix(": test") in LIST_EXPECTED
          ]
          footer = [] if listing is None else FOOTER.findall(listing)
          list_ok = (listing is not None and code == 0 and len(footer) == 1
                     and len(actual_list) == len(LIST_EXPECTED)
                     and set(actual_list) == LIST_EXPECTED)
          result = {"case": "lib_test_list", "cargo_exit": code,
                    "status": "passed" if list_ok else "failed",
                    "expected_count": len(LIST_EXPECTED),
                    "matched_count": len(actual_list),
                    "list_total": int(footer[0]) if len(footer) == 1 else None}
          record("lib_test_list", result)
          overall_failed |= not list_ok

          raw, code, too_large = run(base + ["--lib", "auth::session::http_bridge::tests::"])
          result = test_summary("session_http_bridge", raw, code, too_large,
                                BRIDGE_CASES,
                                frozenset({"runtime/src/auth/session/http_bridge_tests.rs",
                                           "runtime/src/http_server.rs"}))
          record("session_http_bridge", result)
          overall_failed |= result["status"] != "passed"

          raw, code, too_large = run(base + ["--lib", DELIVERY_CASE, "--", "--exact"])
          result = test_summary(
              "delivery_cache_conflict", raw, code, too_large,
              frozenset({DELIVERY_CASE}),
              frozenset({"runtime/src/auth/session/delivery_wire_tests.rs",
                         "runtime/src/http_server.rs"}),
          )
          record("delivery_cache_conflict", result)
          overall_failed |= result["status"] != "passed"

          if os.environ.get("RUNNER_OS") == "Windows":
              browser_command = ["cargo", "test", "--locked", "-p", "nagi-runtime",
                                "--test", "browser_login_public_api", BROWSER_CASE,
                                "--", "--exact", "--nocapture"]
              raw, code, too_large = run(browser_command, cfg=True)
              document, capture_exit = browser_collector.sanitize(
                  None if too_large else raw, code
              )
              if (code == 0 and capture_exit == 0 and document["capture_valid"]
                      and document["test_summary"] == "passed"):
                  status = "passed"
              elif (code == 101 and capture_exit != 0 and document["capture_valid"]
                    and document["test_summary"] == "failed"):
                  status = "tests_failed"
              else:
                  status = "diagnostic_invalid"
              (OUT / "windows_browser_login.json").write_text(
                  json.dumps(document, sort_keys=True, separators=(",", ":")) + "\n",
                  encoding="ascii",
              )
              print(f"pr133_native case=windows_browser_login status={status} cargo_exit={code}")
              overall_failed |= status != "passed"

          for alias, (test_name, source_files) in HTTP_CASES.items():
              command = base + ["--lib", test_name, "--", "--exact"]
              raw, code, too_large = run(command)
              result = test_summary(
                  alias, raw, code, too_large, frozenset({test_name}),
                  frozenset(source_files),
              )
              record(alias, result)
              overall_failed |= result["status"] != "passed"

          raise SystemExit(1 if overall_failed else 0)
          PY
      - name: Preserve only closed focused summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr133-focused-${{ matrix.platform }}
          path: ${{ runner.temp }}/pr133-focused/*.json
          if-no-files-found: ignore

  strict-browser-tls:
    needs: collector-controls
    if: github.ref == 'refs/heads/test/nagi020-pr133-ci-repair-20261019'
    uses: ./.github/workflows/sf08-browser.yml
