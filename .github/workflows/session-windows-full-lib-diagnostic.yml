name: Session Windows full library diagnostic

on:
  create:

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.ref_type == 'branch' &&
      github.event.ref == 'diag/session-windows-full-lib-20261018' &&
      github.ref == 'refs/heads/diag/session-windows-full-lib-20261018'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Reuse the existing Windows Rust dependency and target cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: nagi-rust-v1-package-windows-x86_64-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-rust-v1-package-windows-x86_64-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            nagi-rust-v1-package-windows-x86_64-${{ steps.rust.outputs.cachekey }}-
      - name: Validate the bounded diagnostic collector
        run: python -m unittest scripts.tests.test_session_windows_full_lib_diagnostic
      - name: Compare R6 focused cases with one full library run
        run: python scripts/ci/session_windows_full_lib_diagnostic.py --root .
