name: Nagi website

on:
  pull_request:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'ai/**', 'editors/vscode-nagi/README.md', 'test-nagi-code/**/README.md', 'test-nagi-code/result-try-tutorial/**', 'scripts/verify_result_try_tutorial.py', 'PERFORMANCE.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ci-pin:v4
        with:
          persist-credentials: false # ci-isolation
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ci-pin:v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: python -m pip install -r website/requirements.txt
      - name: Check documentation discovery
        run: python -m unittest discover -s website -p 'test_*.py'
      - name: Check tutorial code even when Rust jobs are skipped for Docs-only changes
        run: python scripts/verify_onboarding_examples.py --docs-only
      - name: Check SQLite tutorial source in Japanese and English
        run: python scripts/verify_sqlite_example.py --docs-only
      - name: Build and check links
        env:
          SITE_REPOSITORY: ${{ github.repository }}
        run: |
          python website/build.py \
          --repository "https://github.com/$SITE_REPOSITORY" \
          --ref "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # ci-pin:v3
        with:
          path: build/website

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # ci-pin:v4
