name: Nagi website

on:
  pull_request:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'editors/vscode-nagi/README.md', 'test-nagi-code/**/README.md', 'PERFORMANCE.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: python -m pip install -r website/requirements.txt
      - name: Build and check links
        env:
          SITE_REPOSITORY_NAME: ${{ github.event.repository.name }}
          SITE_OWNER: ${{ github.repository_owner }}
          SITE_REPOSITORY: ${{ github.repository }}
        run: |
          SITE_BASE_PATH="/$SITE_REPOSITORY_NAME/"
          if [ "${SITE_REPOSITORY_NAME,,}" = "${SITE_OWNER,,}.github.io" ]; then
            SITE_BASE_PATH="/"
          fi
          python website/build.py \
          --base-path "$SITE_BASE_PATH" \
          --site-url "https://${SITE_OWNER,,}.github.io" \
          --repository "https://github.com/$SITE_REPOSITORY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/website

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
