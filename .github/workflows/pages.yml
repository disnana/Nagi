name: Nagi website

on:
  pull_request:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'ai/**', 'editors/vscode-nagi/README.md', 'test-nagi-code/**/README.md', 'test-nagi-code/result-try-tutorial/**', 'scripts/verify_result_try_tutorial.py', 'CHANGELOG.md', 'PERFORMANCE.md', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ci-pin:v4
        with:
          persist-credentials: false # ci-isolation
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # ci-pin:v5
        id: pages
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ci-pin:v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ci-pin:v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install pinned documentation dependencies
        working-directory: website
        run: npm ci --ignore-scripts
      - name: Check tutorial code even when Rust jobs are skipped for Docs-only changes
        run: python scripts/verify_onboarding_examples.py --docs-only
      - name: Check SQLite tutorial source in Japanese and English
        run: python scripts/verify_sqlite_example.py --docs-only
      - name: Type-check the Fumadocs application
        working-directory: website
        run: npm run typecheck
      - name: Build the static Fumadocs site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        working-directory: website
        run: npm run build
      - name: Verify static routes, locales, and search index
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        working-directory: website
        run: npm run verify:static && npm run verify:links
      - name: Install the browser used by documentation QA
        working-directory: website
        run: npx playwright install --with-deps chromium
      - name: Check mobile, keyboard, search, copy, and accessibility behavior
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        working-directory: website
        run: npm run test:browser
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # ci-pin:v3
        with:
          path: website/out

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # ci-pin:v4
