name: Nagi020 Windows newline source controls
'on':
  push:
    branches:
    - test/nagi020-session-head-20261018
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      NAGI_FAILURE_DIR: ${{ github.workspace }}/build/compiler-failures
      NAGI_GOLDEN_CAPTURE_DIR: ${{ github.workspace }}/build/compiler-failures/goldens
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Validate exact LF and CRLF source controls
      shell: bash
      run: 'set -euo pipefail

        python -B scripts/tests/test_session_private_deadline_diagnostic.py

        python -B scripts/tests/test_sf07_request_source.py

        '
