name: Compiler contract exploration
on:
  pull_request:
    paths:
      - '.github/workflows/compiler-contracts.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      profile:
        description: Optional bounded compiler environment to exercise
        type: choice
        options: [compiler-contracts, windows-gnu-target-path]
        default: compiler-contracts
permissions:
  contents: read
concurrency:
  group: compiler-contract-exploration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  expanded:
    if: github.event_name != 'workflow_dispatch' || inputs.profile == 'compiler-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: ['305419896', '3735928559']
    env:
      NAGI_FAILURE_DIR: ${{ github.workspace }}/build/compiler-failures
      NAGI_CONFORMANCE_CASES: '256'
      NAGI_CONFORMANCE_SEED: ${{ matrix.seed }}
      NAGI_FUZZ_MUTATIONS: '10000'
      NAGI_FUZZ_CASES: '128'
      NAGI_FUZZ_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ci-pin:v4
        with:
          persist-credentials: false # ci-isolation
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ci-pin:stable
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ci-pin:v4
        id: nagi_rust_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nagi-contracts-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'compiler/**', 'tests/conformance/**', 'fuzz/**') }}
          restore-keys: nagi-contracts-v1-${{ runner.os }}-
      - name: Fetch locked native fixture dependencies
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          cargo fetch --locked --target "$host"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ci-pin:v5
        with:
          python-version: '3.12'
      - name: Validate corpus registration
        run: python scripts/verify_compiler_contracts.py
      - name: Explore bounded programs through the Rust backend
        run: cargo test --locked -p nagic --test conformance
      - name: Check ownership storage and cancellation regressions
        run: cargo test --locked -p nagic --test view_flow_completion --test view_flow_foundation --test view_container_drop --test scope_runtime_contract --test task_handles --test constant_validation --test auth_boundaries
      - name: Explore mutations and accepted pipeline stages
        run: cargo run --locked -p nagic --example fuzz-smoke
      - name: Preserve compiler failure reproductions
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ci-pin:v4
        with:
          retention-days: 7 # ci-retention
          name: compiler-failures-${{ matrix.seed }}
          path: build/compiler-failures/
          if-no-files-found: ignore

      - name: Save validated Rust cache (main only) # ci-cache-save
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nagi_rust_cache.outputs.cache-hit != 'true' && steps.nagi_rust_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # ci-pin:v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.nagi_rust_cache.outputs.cache-primary-key }}
  windows-gnu-target-path:
    name: Windows GNU/UCRT64 target path (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'windows-gnu-target-path'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ci-pin:v4
        with:
          persist-credentials: false # ci-isolation
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ci-pin:stable
      - name: Build the corrected compiler with the hosted MSVC toolchain
        shell: pwsh
        run: cargo +stable-x86_64-pc-windows-msvc build --locked --release -p nagic
      - name: Select the reporter's GNU/UCRT64 toolchain boundary
        shell: pwsh
        run: |
          $evidence = 'build/ci-evidence/windows-gnu-target-path'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $setupLog = Join-Path $evidence 'setup.log'
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal 2>&1 |
            Tee-Object -FilePath $setupLog -Append
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the Windows GNU Rust toolchain' }
          $ucrt = 'C:\msys64\ucrt64\bin'
          $linker = Join-Path $ucrt 'x86_64-w64-mingw32-gcc.exe'
          if (-not (Test-Path -LiteralPath $linker)) {
            & 'C:\msys64\usr\bin\pacman.exe' -S --noconfirm --needed --noprogressbar mingw-w64-ucrt-x86_64-gcc 2>&1 |
              Tee-Object -FilePath $setupLog -Append
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the signed MSYS2 UCRT64 GCC package' }
          }
          if (-not (Test-Path -LiteralPath $linker)) {
            throw "The UCRT64 GNU linker is unavailable after package installation: $linker"
          }
          $gccVersion = (& $linker -dumpfullversion | Out-String).Trim()
          "UCRT64 GCC version: $gccVersion" | Tee-Object -FilePath $setupLog -Append
          if ($gccVersion -ne '15.2.0') {
            throw "Expected the reporter's GCC 15.2.0, got $gccVersion"
          }
          $ucrt | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Compare released and corrected project-mode builds
        shell: pwsh
        run: |
          x86_64-w64-mingw32-gcc --version
          rustc +stable-x86_64-pc-windows-gnu -vV
          ./scripts/ci/windows_gnu_target_path.ps1 `
            -CurrentCompiler target/release/nagic.exe `
            -EvidenceDirectory build/ci-evidence/windows-gnu-target-path
      - name: Preserve the bounded comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ci-pin:v4
        with:
          retention-days: 7 # ci-retention
          name: windows-gnu-target-path-${{ github.run_attempt }}
          path: build/ci-evidence/windows-gnu-target-path/
          if-no-files-found: error
