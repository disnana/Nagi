name: Compiler contract exploration
on:
  pull_request:
    paths:
      - '.github/workflows/compiler-contracts.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compiler-contract-exploration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  expanded:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: ['305419896', '3735928559']
    env:
      NAGI_FAILURE_DIR: ${{ github.workspace }}/build/compiler-failures
      NAGI_CONFORMANCE_CASES: '256'
      NAGI_CONFORMANCE_SEED: ${{ matrix.seed }}
      NAGI_FUZZ_MUTATIONS: '10000'
      NAGI_FUZZ_CASES: '128'
      NAGI_FUZZ_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ci-pin:v4
        with:
          persist-credentials: false # ci-isolation
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ci-pin:stable
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ci-pin:v4
        id: nagi_rust_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nagi-contracts-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'compiler/**', 'tests/conformance/**', 'fuzz/**') }}
          restore-keys: nagi-contracts-v1-${{ runner.os }}-
      - name: Fetch locked native fixture dependencies
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test -n "$host"
          cargo fetch --locked --target "$host"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ci-pin:v5
        with:
          python-version: '3.12'
      - name: Validate corpus registration
        run: python scripts/verify_compiler_contracts.py
      - name: Explore bounded programs through the Rust backend
        run: cargo test --locked -p nagic --test conformance
      - name: Check ownership storage and cancellation regressions
        run: cargo test --locked -p nagic --test view_flow_completion --test view_flow_foundation --test view_container_drop --test scope_runtime_contract --test task_handles --test constant_validation --test auth_boundaries
      - name: Explore mutations and accepted pipeline stages
        run: cargo run --locked -p nagic --example fuzz-smoke
      - name: Preserve compiler failure reproductions
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ci-pin:v4
        with:
          retention-days: 7 # ci-retention
          name: compiler-failures-${{ matrix.seed }}
          path: build/compiler-failures/
          if-no-files-found: ignore
      - name: Save validated Rust cache (main only) # ci-cache-save
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nagi_rust_cache.outputs.cache-hit != 'true' && steps.nagi_rust_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # ci-pin:v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.nagi_rust_cache.outputs.cache-primary-key }}
