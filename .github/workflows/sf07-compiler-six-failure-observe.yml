name: SF07 scoped compiler failure observation
permissions:
  contents: read
'on':
  push:
    branches:
    - test/sf07-six-failure-observe-20261018
jobs:
  observe-sf07:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/sf07-six-failure-observe-20261018'
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          profile: linux-six-failures
        - os: windows-latest
          profile: windows-mock-send
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      NAGI_ROOT: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Verify exact parent, unchanged source identities and closed controls
      shell: bash
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/sf07-six-failure-guard.py" <<'PY'
