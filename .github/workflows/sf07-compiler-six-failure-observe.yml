          CAP = 2 * 1024 * 1024
          CASE_CAP = 64 * 1024

          class Invalid(Exception):
              pass

          def source_guard():
              if os.environ.get('GITHUB_REF') != 'refs/heads/' + BRANCH:
                  raise Invalid('wrong branch')
              if os.environ.get('RUNNER_OS') != 'Linux' or sys.platform != 'linux':
                  raise Invalid('linux-only profile')
              if 'RUST_TEST_THREADS' in os.environ or 'RUSTFLAGS' in os.environ or 'CARGO_ENCODED_RUSTFLAGS' in os.environ:
                  raise Invalid('diagnostic environment present')
              parent = subprocess.run(['git', 'rev-parse', 'HEAD^'], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False)
              if parent.returncode or parent.stdout.decode('ascii', errors='strict').strip() != PARENT:
                  raise Invalid('parent mismatch')
              changed = subprocess.run(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False)
              if changed.returncode:
                  raise Invalid('diff unavailable')
              names = tuple(sorted(changed.stdout.decode('utf-8', errors='strict').splitlines()))
              if names != CHANGED:
                  raise Invalid('changed path set mismatch')
              for name, (expected, size, lines) in SOURCES.items():
                  path = Path(name)
                  if path.is_symlink() or not path.is_file():
                      raise Invalid('source is not a regular file')
                  with path.open('rb') as handle:
                      raw = handle.read(size + lines + 1)
                  if len(raw) > size + lines:
                      raise Invalid('source size limit')
                  normalized = raw.replace(b'\r\n', b'\n')
                  if b'\r' in normalized or len(normalized) != size:
                      raise Invalid('source line ending or size')
                  normalized.decode('utf-8', errors='strict')
                  blob = hashlib.sha1(b'blob ' + str(len(normalized)).encode() + b'\0' + normalized).hexdigest()
                  if blob != expected:
                      raise Invalid('source identity mismatch')
              print('source_guard=pass exact_parent=1 runner_os=Linux cfg=normal sources=' + str(len(SOURCES)) + ' changed_paths=' + str(len(CHANGED)) + ' line_endings=LF_or_CRLF')

          def capture(argv, limit=CAP):
              try:
                  process = subprocess.Popen(argv, stdout=subprocess.PIPE, stderr=subprocess.PIPE, bufsize=0)
              except OSError:
                  return 127, b'', b'', {'out': False, 'err': False}
              outputs = {'out': bytearray(), 'err': bytearray()}
              overflow = {'out': False, 'err': False}
              def drain(pipe, key):
                  while True:
                      chunk = pipe.read(8192)
                      if not chunk:
                          return
                      room = limit - len(outputs[key])
                      if room > 0:
                          outputs[key].extend(chunk[:room])
                      if len(chunk) > room:
                          overflow[key] = True
              readers = [threading.Thread(target=drain, args=(process.stdout, 'out'), daemon=True),
                         threading.Thread(target=drain, args=(process.stderr, 'err'), daemon=True)]
              for reader in readers:
                  reader.start()
              code = process.wait()
              for reader in readers:
                  reader.join()
              return code, bytes(outputs['out']), bytes(outputs['err']), overflow

          def decode(raw):
              text = raw.decode('utf-8', errors='strict').replace('\r\n', '\n')
              if '\r' in text:
                  raise Invalid('bare output carriage return')
              return text

          def parse_list(raw, required=()):
              text = decode(raw)
              names, footers = [], []
              for line in text.splitlines():
                  if not line:
                      continue
                  row = re.fullmatch(r'([A-Za-z0-9_:]+): test', line)
                  if row:
                      names.append(row.group(1))
                      continue
                  footer = re.fullmatch(r'(\d+) tests?, 0 benchmarks', line)
                  if footer:
                      footers.append(int(footer.group(1)))
                      continue
                  raise Invalid('list grammar')
              if not names or len(names) > 10000 or len(names) != len(set(names)):
                  raise Invalid('list inventory')
              if footers != [len(names)]:
                  raise Invalid('list footer count')
              required = tuple(required)
              if len(required) != len(set(required)) or any(names.count(name) != 1 for name in required):
                  raise Invalid('required case identity')
              return tuple(names)

          def parse_result(raw, expected, filtered=0):
              text = decode(raw)
              lines = text.splitlines()
              summary_rows = []
              for index, line in enumerate(lines):
                  result = re.fullmatch(r'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in ([0-9]+(?:\.[0-9]+)?)s', line)
                  if result:
                      summary_rows.append((index, result.group(1), *[int(result.group(i)) for i in range(2, 7)]))
              if len(summary_rows) != 1:
                  raise Invalid('result summary count')
              summary_index, outcome, got_passed, got_failed, got_ignored, measured, got_filtered = summary_rows[0]
              if any(line for line in lines[summary_index + 1:]):
                  raise Invalid('trailing result output')

              statuses, running, progress, markers = [], [], [], []
              initial_failure_header = False
              failure_body_boundary = False
              first_output = next((index for index, line in enumerate(lines[:summary_index])
                                   if re.fullmatch(r'---- ([A-Za-z0-9_:]+) stdout ----', line)), summary_index)
              prefix = lines[:first_output]
              for line in prefix:
                  if failure_body_boundary:
                      if not line:
                          continue
                      raise Invalid('failure output boundary')
                  if not line:
                      continue
                  if line == 'failures:':
                      if initial_failure_header or len(statuses) != len(expected) or not any(state == 'FAILED' for _, state in statuses):
                          raise Invalid('initial failure header')
                      initial_failure_header = True
                      failure_body_boundary = True
                      continue
                  runline = re.fullmatch(r'running (\d+) tests?', line)
                  if runline:
                      running.append(int(runline.group(1)))
                      continue
                  row = re.fullmatch(r'test ([A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored)', line)
                  if row:
                      statuses.append((row.group(1), row.group(2)))
                      continue
                  notice = re.fullmatch(r'test ([A-Za-z0-9_:]+) has been running for over 60 seconds', line)
                  if notice:
                      progress.append(notice.group(1))
                      continue
                  raise Invalid('result prefix grammar')

              for line in lines[first_output:summary_index]:
                  marker = re.fullmatch(r'---- ([A-Za-z0-9_:]+) stdout ----', line)
                  if marker:
                      markers.append(marker.group(1))

              if len(running) != 1 or running[0] != len(expected) or len(statuses) != len(expected):
                  raise Invalid('result row count')
              names = [name for name, _ in statuses]
              if len(names) != len(set(names)) or set(names) != set(expected):
                  raise Invalid('result identity')
              failed_names = {name for name, state in statuses if state == 'FAILED'}
              if initial_failure_header != bool(failed_names):
                  raise Invalid('initial failure header identity')
              if initial_failure_header:
                  header_index = prefix.index('failures:')
                  if header_index == 0 or prefix[header_index - 1] or header_index == len(prefix) - 1:
                      raise Invalid('failure header boundary')
              if any(name not in expected for name in progress) or any(name not in failed_names for name in markers):
                  raise Invalid('progress or output identity')
              if len(markers) != len(set(markers)):
                  raise Invalid('duplicate failure output')

              trailer = lines[:summary_index]
              while trailer and not trailer[-1]:
                  trailer.pop()
              reported_failures = []
              if failed_names:
                  while trailer:
                      failure = re.fullmatch(r'    ([A-Za-z0-9_:]+)', trailer[-1])
                      if not failure:
                          break
                      reported_failures.append(failure.group(1))
                      trailer.pop()
                  while trailer and not trailer[-1]:
                      trailer.pop()
                  if not trailer or trailer[-1] != 'failures:':
                      raise Invalid('failure footer missing')
                  trailer.pop()
                  if len(reported_failures) != len(set(reported_failures)) or set(reported_failures) != failed_names:
                      raise Invalid('failure inventory')
              elif markers or any(line == 'failures:' for line in trailer):
                  raise Invalid('unexpected failure footer')

              passed = sum(state == 'ok' for _, state in statuses)
              failed = sum(state == 'FAILED' for _, state in statuses)
              ignored = sum(state == 'ignored' for _, state in statuses)
              if (passed, failed, ignored) != (got_passed, got_failed, got_ignored) or measured != 0 or got_filtered != filtered:
                  raise Invalid('result counts')
              if (outcome == 'ok') != (failed == 0):
                  raise Invalid('result outcome')
              return passed, failed, ignored, measured, got_filtered, tuple(sorted(name for name, state in statuses if state == 'FAILED'))

          CASES = (
              ('http_stdlib', 'status_method_and_db_free_app_execute_from_high_and_saved_low', 32),
              ('http_codegen', 'borrow_and_named_mapper_registration_execute_native_adapters', 4),
              ('error_routes', 'explicit_http_json_routes_preserve_data_and_optional_payloads_in_high_and_low', 2),
              ('security_sf01_native', 'policies_and_nominal_request_proofs_execute_in_all_three_paths', 0),
              ('security_sf05_native', 'query_parameters_and_protected_predicate_execute_high_saved_and_handwritten_low', 0),
              ('http_entrypoint', 'explicit_http_server_builds_and_returns_invalid_port_in_high_and_low', 3),
          )
          DISPLAY_CAP = CASE_CAP
          TOKEN_RE = re.compile(r'(?i)\b(bearer[ \t]+)[A-Za-z0-9._~+/=-]+')


          def _visible_text(raw):
              text = raw.decode('utf-8', errors='backslashreplace').replace('\r\n', '\n')
              text = TOKEN_RE.sub(r'\1[STATIC_TEST_TOKEN_REDACTED]', text)
              out = []
              for char in text:
                  code = ord(char)
                  if char == '\n':
                      out.append(char)
                  elif char == '\t':
                      out.append('\\t')
                  elif char.isprintable():
                      out.append(char)
                  elif code <= 0xff:
                      out.append(f'\\x{code:02x}')
                  else:
                      out.append(f'\\u{code:04x}')
              return ''.join(out)


          def diagnostic_lines(stream, raw, overflow):
              text = _visible_text(raw)
              result = []
              used = 0
              marker = 'native_diag|[display truncated]'
              marker_size = len(marker.encode('utf-8')) + 1
              prefix = 'native_diag|'
              prefix_size = len(prefix.encode('utf-8'))
              for line in text.split('\n'):
                  rendered = prefix + line
                  encoded = rendered.encode('utf-8') + b'\n'
                  if used + len(encoded) + marker_size > DISPLAY_CAP:
                      available = DISPLAY_CAP - used - marker_size
                      if available > prefix_size:
                          body = line.encode('utf-8')[:max(0, available - prefix_size - 1)]
                          clipped = body.decode('utf-8', errors='ignore')
                          result.append(prefix + clipped)
                      result.append(marker)
                      break
                  result.append(rendered)
                  used += len(encoded)
              return result

          def _overflowed(overflow):
              return any(overflow.values()) if isinstance(overflow, dict) else bool(overflow)


          def _stream_overflow(overflow, key):
              return bool(overflow.get(key, False)) if isinstance(overflow, dict) else bool(overflow)


          def emit_diagnostics(case, stdout, stderr, overflow):
              for key, raw in (('out', stdout), ('err', stderr)):
                  stream = 'stdout' if key == 'out' else 'stderr'
                  print('failure_diagnostic case=' + case + ' stream=' + stream +
                        ' captured_bytes=' + str(len(raw)) +
                        ' overflow=' + str(int(_stream_overflow(overflow, key))))
                  for line in diagnostic_lines(stream, raw, _stream_overflow(overflow, key)):
                      print(line)


          def _reject(call, expected_message):
              try:
                  call()
              except Invalid:
                  return
              raise Invalid(expected_message)


          NATIVE_CASES = (
              ('http_stdlib', 'status_method_and_db_free_app_execute_from_high_and_saved_low'),
              ('http_codegen', 'borrow_and_named_mapper_registration_execute_native_adapters'),
              ('error_routes', 'explicit_http_json_routes_preserve_data_and_optional_payloads_in_high_and_low'),
              ('security_sf01_native', 'policies_and_nominal_request_proofs_execute_in_all_three_paths'),
              ('security_sf05_native', 'query_parameters_and_protected_predicate_execute_high_saved_and_handwritten_low'),
              ('http_entrypoint', 'explicit_http_server_builds_and_returns_invalid_port_in_high_and_low'),
          )
          UNIT_CASES = ('http_server::response_public::tests::security_refusals_keep_six_stable_bodies_head_cors_and_challenges', 'http_server::response_public::tests::security_replacement_retains_typed_body_and_generic_status_fallback_stays_generic', 'http_server::response_budget::finalize::tests::security_fallback_catalog_and_last_body_view_keep_finite_credit', 'http_server::tests::security_tests::head_inherits_get_policy_and_no_implicit_options_or_health', 'http_server::tests::security_tests::all_security_failure_kinds_have_stable_wire_status')
          UNIT_TARGET = 'runtime_lib'
          INVENTORY_NAME = 'sf07-r9-test-inventory.json'
          INVENTORY_VERSION = 1


          def cargo(args):
              return ['cargo', *args]


          def _target_args(target):
              if target == UNIT_TARGET:
                  return ['test', '--locked', '-p', 'nagi-runtime', '--lib']
              return ['test', '--locked', '-p', 'nagic', '--test', target]


          def _all_cases():
              return ((UNIT_TARGET, case) for case in UNIT_CASES)


          def _inventory_cases():
              return (*((UNIT_TARGET, case) for case in UNIT_CASES), *NATIVE_CASES)


          def _target_names():
              return (UNIT_TARGET, *(target for target, _ in NATIVE_CASES))


          def _run_process(argv, label):
              code, stdout, stderr, overflow = capture(argv)
              if code != 0 or _overflowed(overflow):
                  print(label + '=fail cargo_exit=' + str(code) + ' capture=' + ('overflow' if _overflowed(overflow) else 'bounded'))
                  emit_diagnostics(label, stdout, stderr, overflow)
                  return None
              return stdout


          def compile_targets():
              code, stdout, stderr, overflow = capture(cargo(['fetch', '--locked']))
              good = code == 0 and not _overflowed(overflow)
              print('locked_dependency_fetch=' + ('pass' if good else 'fail') +
                    ' cargo_exit=' + str(code) + ' capture=' + ('overflow' if _overflowed(overflow) else 'bounded'))
              if not good:
                  emit_diagnostics('locked_dependency_fetch', stdout, stderr, overflow)
                  return 1
              args = ['test', '--locked', '-p', 'nagic']
              for target, _ in NATIVE_CASES:
                  args.extend(['--test', target])
              args.append('--no-run')
              code, stdout, stderr, overflow = capture(cargo(args))
              good = code == 0 and not _overflowed(overflow)
              print('six_native_harness_compile=' + ('pass' if good else 'fail') +
                    ' cargo_exit=' + str(code) + ' capture=' + ('overflow' if _overflowed(overflow) else 'bounded'))
              if not good:
                  emit_diagnostics('six_native_harness_compile', stdout, stderr, overflow)
                  return 1
              code, stdout, stderr, overflow = capture(cargo(['test', '--locked', '-p', 'nagi-runtime', '--lib', '--no-run']))
              good = code == 0 and not _overflowed(overflow)
              print('runtime_unit_harness_compile=' + ('pass' if good else 'fail') +
                    ' cargo_exit=' + str(code) + ' capture=' + ('overflow' if _overflowed(overflow) else 'bounded'))
              if not good:
                  emit_diagnostics('runtime_unit_harness_compile', stdout, stderr, overflow)
              return 0 if good else 1


          def _inventory_file():
              runner_temp = os.environ.get('RUNNER_TEMP')
              if not runner_temp:
                  raise Invalid('runner temp unavailable')
              root = Path(runner_temp)
              if root.is_symlink() or not root.is_dir():
                  raise Invalid('runner temp invalid')
              return root / INVENTORY_NAME


          def _write_inventory(entries):
              path = _inventory_file()
              if path.exists() or path.is_symlink():
                  raise Invalid('inventory already exists')
              doc = {'version': INVENTORY_VERSION, 'targets': entries}
              raw = (json.dumps(doc, sort_keys=True, separators=(',', ':')) + '\n').encode('ascii')
              if len(raw) > 8192:
                  raise Invalid('inventory size')
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'wb') as handle:
                  handle.write(raw)


          def _load_inventory():
              path = _inventory_file()
              if path.is_symlink() or not path.is_file():
                  raise Invalid('inventory missing')
              with path.open('rb') as handle:
                  raw = handle.read(8193)
              if len(raw) > 8192:
                  raise Invalid('inventory size')
              def no_duplicate_pairs(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise Invalid('inventory duplicate key')
                      result[key] = value
                  return result
              doc = json.loads(raw.decode('ascii', errors='strict'), object_pairs_hook=no_duplicate_pairs)
              if not isinstance(doc, dict) or set(doc) != {'version', 'targets'} or doc['version'] != INVENTORY_VERSION:
                  raise Invalid('inventory schema')
              targets = doc['targets']
              if not isinstance(targets, dict) or set(targets) != set(_target_names()):
                  raise Invalid('inventory targets')
              required_by_target = {target: [] for target in _target_names()}
              for target, case in _inventory_cases():
                  required_by_target[target].append(case)
              for target, cases in required_by_target.items():
                  entry = targets[target]
                  if not isinstance(entry, dict) or set(entry) != {'count', 'cases'}:
                      raise Invalid('inventory entry schema')
                  count = entry['count']
                  if isinstance(count, bool) or not isinstance(count, int) or not 1 <= count <= 10000:
                      raise Invalid('inventory count')
                  if entry['cases'] != cases or len(set(cases)) != len(cases) or count < len(cases):
                      raise Invalid('inventory selected cases')
              return targets


          def inventories():
              entries = {}
              failed = False
              required_by_target = {target: [] for target in _target_names()}
              for target, case in _inventory_cases():
                  required_by_target[target].append(case)
              for target in _target_names():
                  argv = cargo([*_target_args(target), '--', '--list'])
                  code, stdout, stderr, overflow = capture(argv)
                  try:
                      if code != 0 or _overflowed(overflow):
                          raise Invalid('list command failed')
                      names = parse_list(stdout, required_by_target[target])
                      entries[target] = {'count': len(names), 'cases': required_by_target[target]}
                      print('test_inventory target=' + target + ' state=pass total=' + str(len(names)) +
                            ' selected=' + str(len(required_by_target[target])))
                  except Exception:
                      print('test_inventory target=' + target + ' state=unavailable cargo_exit=' + str(code) +
                            ' capture=' + ('overflow' if _overflowed(overflow) else 'bounded'))
                      emit_diagnostics(target + '_list', stdout, stderr, overflow)
                      failed = True
              if failed:
                  return 1
              try:
                  _write_inventory(entries)
              except Exception:
                  print('test_inventory_checkpoint=unavailable')
                  return 1
              print('test_inventory_checkpoint=pass targets=' + str(len(entries)))
              return 0


          def _filtered_count(inventory, target):
              count = inventory[target]['count']
              if isinstance(count, bool) or not isinstance(count, int) or count < 1:
                  raise Invalid('inventory count')
              return count - 1


          def _run_one(target, case, inventory):
              filtered = _filtered_count(inventory, target)
              argv = cargo([*_target_args(target), case, '--', '--exact'])
              code, stdout, stderr, overflow = capture(argv, limit=CASE_CAP)
              try:
                  if _overflowed(overflow):
                      raise Invalid('bounded capture overflow')
                  parsed = parse_result(stdout, [case], filtered)
                  passed, failures, ignored, measured, got_filtered, failed_names = parsed
                  if code == 0 and (passed, failures, ignored, measured, got_filtered, failed_names) == (1, 0, 0, 0, filtered, ()):
                      print('case_observation target=' + target + ' name=' + case +
                            ' state=pass cargo_exit=0 passed=1 failed=0 ignored=0 filtered=' + str(filtered))
                      return 0
                  if code != 0 and (passed, failures, ignored, measured, got_filtered, failed_names) == (0, 1, 0, 0, filtered, (case,)):
                      print('case_observation target=' + target + ' name=' + case +
                            ' state=fail cargo_exit=' + str(code) + ' passed=0 failed=1 ignored=0 filtered=' + str(filtered))
                      emit_diagnostics(case, stdout, stderr, overflow)
                      return 1
                  reason = 'exit_or_count_mismatch'
              except Exception:
                  reason = 'bounded_capture_overflow' if _overflowed(overflow) else 'result_grammar'
              print('case_observation target=' + target + ' name=' + case +
                    ' state=unavailable cargo_exit=' + str(code) + ' reason=' + reason +
                    ' capture=' + ('overflow' if _overflowed(overflow) else 'bounded'))
              emit_diagnostics(case, stdout, stderr, overflow)
              return 1


          def run_units():
              try:
                  inventory = _load_inventory()
              except Exception:
                  print('runtime_unit_inventory=unavailable')
                  return 1
              failed = False
              for case in UNIT_CASES:
                  failed |= bool(_run_one(UNIT_TARGET, case, inventory))
              return int(failed)


          def run_native():
              try:
                  inventory = _load_inventory()
              except Exception:
                  print('native_inventory=unavailable')
                  return 1
              failed = False
              for target, case in NATIVE_CASES:
                  # R10 already executed the other five unchanged native cases successfully.
                  if target == 'error_routes':
                      failed |= bool(_run_one(target, case, inventory))
              return int(failed)


          def _reject(call, expected_message):
              try:
                  call()
              except Invalid:
                  return
              raise Invalid(expected_message)


          def selftest():
              # Real libtest --list framing has a blank line before its footer.
              listing = b'case_one: test\ncase_two: test\n\n2 tests, 0 benchmarks\n'
              names = parse_list(listing, ['case_one', 'case_two'])
              if names != ('case_one', 'case_two'):
                  raise Invalid('full inventory positive')
              _reject(lambda: parse_list(b'\n0 tests, 0 benchmarks\n', ['case_one']), 'zero inventory mutant')
              _reject(lambda: parse_list(b'case_one: test\ncase_one: test\n\n2 tests, 0 benchmarks\n', ['case_one']), 'duplicate inventory mutant')
              _reject(lambda: parse_list(b'other_case: test\n\n1 test, 0 benchmarks\n', ['case_one']), 'missing selected case mutant')
              _reject(lambda: parse_list(b'case_one: test\n\n2 tests, 0 benchmarks\n', ['case_one']), 'footer count mutant')
              _reject(lambda: parse_list(b'case_one: test\n\n1 test, 1 benchmark\n', ['case_one']), 'benchmark mutant')
              passed = b'running 1 test\ntest case_one ... ok\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 4 filtered out; finished in 0.01s\n'
              if parse_result(passed, ['case_one'], 4) != (1, 0, 0, 0, 4, ()):
                  raise Invalid('passing profile positive')
              if _filtered_count({'target': {'count': len(names)}}, 'target') != 1:
                  raise Invalid('filtered count not derived from full inventory')
              failed = (b'running 1 test\ntest case_one ... FAILED\n\nfailures:\n\n'
                        b'---- case_one stdout ----\nstatic fixture failure\n\nfailures:\n'
                        b'    case_one\n\n\ntest result: FAILED. 0 passed; 1 failed; 0 ignored; '
                        b'0 measured; 4 filtered out; finished in 0.01s\n')
              expected_failure = (0, 1, 0, 0, 4, ('case_one',))
              if parse_result(failed, ['case_one'], 4) != expected_failure:
                  raise Invalid('standard named failure positive')
              _reject(lambda: parse_result(failed.replace(b'4 filtered out', b'3 filtered out'), ['case_one'], 4), 'filter mismatch mutant')
              rendered = '\n'.join(diagnostic_lines('stderr',
                  b'www-authenticate: Bearer\nVary: origin\nAuthorization: Bearer r9_dummy_same_line_token\n', False))
              if 'native_diag|www-authenticate: Bearer\nnative_diag|Vary: origin' not in rendered:
                  raise Invalid('newline header preservation')
              if 'r9_dummy_same_line_token' in rendered or '[STATIC_TEST_TOKEN_REDACTED]' not in rendered:
                  raise Invalid('same-line token redaction')
              plain = '\n'.join(diagnostic_lines('stderr', b'Vary: Accept-Encoding\nBearer\n', False))
              if 'native_diag|Vary: Accept-Encoding' not in plain or '[STATIC_TEST_TOKEN_REDACTED]' in plain:
                  raise Invalid('non-token header preservation')
              clipped = diagnostic_lines('stdout', b'x' * (DISPLAY_CAP * 2), True)
              if sum(len(line.encode('utf-8')) + 1 for line in clipped) > DISPLAY_CAP or not any('display truncated' in line for line in clipped):
                  raise Invalid('diagnostic display cap')
              print('r9_collector_controls=pass full_inventory=exact counts=dynamic failure=closed token_redaction=same_line_only newline_header=preserved bounded_capture=pass')


          def main():
              try:
                  if len(sys.argv) != 2:
                      raise Invalid('mode')
                  mode = sys.argv[1]
                  if mode == 'selftest':
                      selftest()
                      return 0
                  if mode == 'sources':
                      source_guard()
                      return 0
                  if mode == 'compile':
                      return compile_targets()
                  if mode == 'list':
                      return inventories()
                  if mode == 'run-units':
                      return run_units()
                  if mode == 'run-native':
                      return run_native()
                  raise Invalid('mode')
              except Exception:
                  print('r9_guard=unavailable reason=closed_validation_failure')
                  return 2

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          python3 "$RUNNER_TEMP/sf07-r9-guard.py" selftest
          python3 "$RUNNER_TEMP/sf07-r9-guard.py" sources
      - name: Fetch locked dependencies and compile six native harnesses plus runtime unit harness
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-r9-target
          NAGI_NATIVE_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-r9-target
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sf07-r9-guard.py" compile
      - name: Collect full inventories before selecting eleven exact cases
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-r9-target
          NAGI_NATIVE_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-r9-target
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sf07-r9-guard.py" list
      - name: Run corrected JSON native case once; reuse unchanged R10 cases
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-r9-target
          NAGI_NATIVE_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-r9-target
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/sf07-r9-guard.py" run-native
