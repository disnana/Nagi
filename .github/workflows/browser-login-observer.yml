name: BrowserLogin diagnostic observation
on:
  workflow_dispatch:
    inputs:
      browser_login_phase_diagnostic:
        description: Observe the exact BrowserLogin test without changing its deadline or assertions.
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: browser-login-observation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-login-public-phase-diagnostic:
    name: BrowserLogin phase diagnostic (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.browser_login_phase_diagnostic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ci-pin:v4
        with:
          persist-credentials: false # ci-isolation
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ci-pin:stable
        id: rust
      - name: Cache the target platform's Rust build
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # ci-pin:v4
        id: nagi_rust_cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ci-pin:v5
        with:
          python-version: '3.12'
      - name: Check bounded BrowserLogin diagnostic collector controls
        run: python -B -m unittest discover -s tests -p 'test_browser_login_phase_diagnostic.py'
      - name: Capture the exact public test with manual phase diagnostics
        shell: bash
        run: |
          set +e
          RUSTFLAGS='--cfg nagi_browser_login_diag' cargo test --locked -p nagi-runtime --test browser_login_public_api committed_claim_stays_consumed_on_verifier_error_panic_and_deadline -- --exact --nocapture > "$RUNNER_TEMP/browser-login-phase.raw" 2>&1
          cargo_rc=$?
          python scripts/ci/browser_login_phase_diagnostic.py "$RUNNER_TEMP/browser-login-phase.raw" "$cargo_rc" "$RUNNER_TEMP/browser-login-phase.json"
          sanitize_rc=$?
          rm -f "$RUNNER_TEMP/browser-login-phase.raw"
          if (( cargo_rc != 0 )); then
            exit "$cargo_rc"
          fi
          exit "$sanitize_rc"
      - name: Preserve sanitized BrowserLogin phase records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ci-pin:v4
        with:
          retention-days: 7 # ci-retention
          name: browser-login-phase-${{ matrix.platform }}
          path: ${{ runner.temp }}/browser-login-phase.json
          if-no-files-found: error

      - name: Save validated Rust cache (main only) # ci-cache-save
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.nagi_rust_cache.outputs.cache-hit != 'true' && steps.nagi_rust_cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # ci-pin:v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: ${{ steps.nagi_rust_cache.outputs.cache-primary-key }}
