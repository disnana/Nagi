name: Closed editor stage observation
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  intel-editor-observation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ci-pin:v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # ci-pin:stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # ci-pin:v4
        with:
          node-version: '22'
      - name: Verify exact observation sources and closed fakes
        run: |
          python -B scripts/ci/editor_stage_source_guard.py
          python -B scripts/tests/test_editor_stage_observation_source.py
          node scripts/tests/test_editor_stage_observation.cjs
      - name: Measure two isolated cases and current parallel editor suite
        run: node scripts/ci/editor_stage_measurement.cjs
