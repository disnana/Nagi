name: SF07 public response scoped production check
on:
  push:
    branches:
      - test/sf07-u4-production-20261018
permissions:
  contents: read
jobs:
  production:
    if: github.ref == 'refs/heads/test/sf07-u4-production-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify parent and reviewed production source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1945b38d222eb06ef9d9fd8fff09648832337f98"
          sha256sum --check <<'HASHES'
          b2fc31b270e0a3ed2cfb3e142156365750298527d31e9f54da735af664f531a8  runtime/src/auth.rs
          8eb9c7e34e272d28c63cceec50bcc6526ecd6d518721df2a4c2f239b8bf678c8  runtime/src/auth/session.rs
          f7a5f17425aa65e6344b5452e246c97e26fc66af8bbbfceecdc7e12c99fc0b83  runtime/src/auth/session/delivery.rs
          048dcbad80abb4ba296cd9a47beb5b3adba3f42fc6a0f0df64e8f287c408f316  runtime/src/auth/session/http_bridge.rs
          c30bf5287f448b9b0214d47dc29a0a4c50c6f3e611028352de3967ec9587817d  runtime/src/http_server.rs
          9947895cc5a1eeb461e3b327ab9b9df1231b37281ecc0d6b448d12752ab08313  runtime/src/http_server/csrf_http.rs
          7ecdfabaecfc784104cea86b9640cb48d284b0a73882699bc821da7f1793fbc4  runtime/src/http_server/prelogin_http.rs
          b56eacba20d855fe40faf918c5021d6859b630a0531e54040c62a8ce0c53f8ca  runtime/src/http_server/rate_public.rs
          b8cf36a9bf90ec9a3a49dc0f792e63ac6b913e37e675da6eb5ee9cf2a27168b1  runtime/src/http_server/request_headers.rs
          a2274938a3609be2a09062464f37ad9ea1b87ac3eef97f3b381fe8812dddada7  runtime/src/http_server/response_public.rs
          fa17657956dc38b2994cb2803d4146759097cd92299c9a56751c407347a721b1  runtime/src/security_sf07_private/mod.rs
          f4222ed85eb95309d86fce2da71271a31d5cc549d7e99137d98432ee7ab672b6  runtime/src/security_sf07_private/startup_rate.rs
          HASHES
      - name: Typecheck production library before test consumers
        run: cargo check --locked -p nagi-runtime --lib
