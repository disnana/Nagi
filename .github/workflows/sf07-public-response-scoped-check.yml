name: SF07 focused compiler and native integration
permissions:
  contents: read
jobs:
  compiler-contracts:
    if: github.ref == 'refs/heads/test/sf07-compiler-native-20261018'
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-15
        - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      NAGI_ROOT: ${{ github.workspace }}
