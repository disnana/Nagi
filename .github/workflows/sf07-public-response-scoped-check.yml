name: SF07 limited U5 native regression
on:
  push:
    branches:
      - test/sf07-u4-production-20261018
permissions:
  contents: read
jobs:
  targeted-native:
    if: github.ref == 'refs/heads/test/sf07-u4-production-20261018'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Verify exact parent, frozen source and closed guard controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "37bf7d1026bf8dda41fe77d12d8136b935af847f"
          test -z "${RUST_TEST_THREADS+x}"
