name: SF07 public response scoped production check
on:
  push:
    branches:
      - test/sf07-u4-production-20261018
permissions:
  contents: read
jobs:
  production:
    if: github.ref == 'refs/heads/test/sf07-u4-production-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify parent and reviewed production source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "553fd56ea67b6cff8b76ae65fc81a2e9e12ce8d2"
          sha256sum --check <<'HASHES'
          40cb53addb3f39165339e813b900f0a3acf25d85e95ac851601809217e6322a5  runtime/src/auth/session.rs
          93d4719621c2fa7eefc67c614b412747dc56f88c1b0fb08c3e1ebe4f0a696c84  runtime/src/auth/session/http_bridge.rs
          8e47b5d244000fbaad57c58e68313527c4e8d949844692cad966d0a90b768de1  runtime/src/auth/session/secrets.rs
          b1d1f65cfdb530de91427d99a9ac3935087143664c169872312279e667634a01  runtime/src/http_server.rs
          803945bfa86e0c983517b6eff8aa4cb5cc8e5f1ed9c0efde511727a3165b2e60  runtime/src/http_server/browser_login.rs
