            lines = text.splitlines()
            summary_rows = []
            for index, line in enumerate(lines):
                result = re.fullmatch(r'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in ([0-9]+(?:\.[0-9]+)?)s', line)
                if result:
                    summary_rows.append((index, result.group(1), *[int(result.group(i)) for i in range(2, 7)]))
            if len(summary_rows) != 1:
                raise Invalid('result summary count')
            summary_index, outcome, got_passed, got_failed, got_ignored, measured, got_filtered = summary_rows[0]
            if any(line for line in lines[summary_index + 1:]):
                raise Invalid('trailing result output')

            statuses, running, progress, markers = [], [], [], []
            initial_failure_header = False
            failure_body_boundary = False
            first_output = next((index for index, line in enumerate(lines[:summary_index])
                                 if re.fullmatch(r'---- ([A-Za-z0-9_:]+) stdout ----', line)), summary_index)
            prefix = lines[:first_output]
            for line in prefix:
                if failure_body_boundary:
                    if not line:
                        continue
                    raise Invalid('failure output boundary')
                if not line:
                    continue
                if line == 'failures:':
                    if initial_failure_header or len(statuses) != len(expected) or not any(state == 'FAILED' for _, state in statuses):
                        raise Invalid('initial failure header')
                    initial_failure_header = True
                    failure_body_boundary = True
                    continue
                runline = re.fullmatch(r'running (\d+) tests?', line)
                if runline:
                    running.append(int(runline.group(1)))
                    continue
                row = re.fullmatch(r'test ([A-Za-z0-9_:]+) \.\.\. (ok|FAILED|ignored)', line)
                if row:
                    statuses.append((row.group(1), row.group(2)))
                    continue
                notice = re.fullmatch(r'test ([A-Za-z0-9_:]+) has been running for over 60 seconds', line)
                if notice:
                    progress.append(notice.group(1))
                    continue
                raise Invalid('result prefix grammar')

            for line in lines[first_output:summary_index]:
                marker = re.fullmatch(r'---- ([A-Za-z0-9_:]+) stdout ----', line)
                if marker:
                    markers.append(marker.group(1))

            if len(running) != 1 or running[0] != len(expected) or len(statuses) != len(expected):
                raise Invalid('result row count')
            names = [name for name, _ in statuses]
            if len(names) != len(set(names)) or set(names) != set(expected):
                raise Invalid('result identity')
            failed_names = {name for name, state in statuses if state == 'FAILED'}
            if initial_failure_header != bool(failed_names):
                raise Invalid('initial failure header identity')
            if initial_failure_header:
                header_index = prefix.index('failures:')
                if header_index == 0 or prefix[header_index - 1] or header_index == len(prefix) - 1:
                    raise Invalid('failure header boundary')
            if any(name not in expected for name in progress) or any(name not in failed_names for name in markers):
                raise Invalid('progress or output identity')
            if len(markers) != len(set(markers)):
                raise Invalid('duplicate failure output')

            trailer = lines[:summary_index]
            while trailer and not trailer[-1]:
                trailer.pop()
            reported_failures = []
            if failed_names:
                while trailer:
                    failure = re.fullmatch(r'    ([A-Za-z0-9_:]+)', trailer[-1])
                    if not failure:
                        break
                    reported_failures.append(failure.group(1))
                    trailer.pop()
                while trailer and not trailer[-1]:
                    trailer.pop()
                if not trailer or trailer[-1] != 'failures:':
                    raise Invalid('failure footer missing')
                trailer.pop()
                if len(reported_failures) != len(set(reported_failures)) or set(reported_failures) != failed_names:
                    raise Invalid('failure inventory')
            elif markers or any(line == 'failures:' for line in trailer):
                raise Invalid('unexpected failure footer')

            passed = sum(state == 'ok' for _, state in statuses)
            failed = sum(state == 'FAILED' for _, state in statuses)
            ignored = sum(state == 'ignored' for _, state in statuses)
            if (passed, failed, ignored) != (got_passed, got_failed, got_ignored) or measured != 0 or got_filtered != filtered:
                raise Invalid('result counts')
            if (outcome == 'ok') != (failed == 0):
                raise Invalid('result outcome')
            return passed, failed, ignored, measured, got_filtered, tuple(sorted(name for name, state in statuses if state == 'FAILED'))

        def selftest():
            source = b'abc\n'
            digest = hashlib.sha1(b'blob 4\0' + source).hexdigest()
            def source_ok(raw):
                norm = raw.replace(b'\r\n', b'\n')
                if b'\r' in norm or len(norm) != 4:
                    raise Invalid('synthetic source')
                if hashlib.sha1(b'blob ' + str(len(norm)).encode() + b'\0' + norm).hexdigest() != digest:
                    raise Invalid('synthetic source')
            source_ok(b'abc\n'); source_ok(b'abc\r\n')
            for raw in (b'abd\n', b'abc\r', b'abc\nX'):
                try: source_ok(raw)
                except Invalid: pass
                else: raise Invalid('source mutant accepted')
            if parse_list(b'case_one: test\n\n1 test, 0 benchmarks\n', ['case_one']) != 1:
                raise Invalid('list positive')
            for raw in (b'case_one: test\n2 tests, 0 benchmarks\n',
                        b'case_one: test\n1 test, 1 benchmark\n',
                        b'case_one: test\ncase_one: test\n1 test, 0 benchmarks\n',
                        b'case_one: test\n\n1 test, 29 filtered out; 0 benchmarks\n',
                        b'case_one: test\rX\n\n1 test, 0 benchmarks\n'):
                try: parse_list(raw, ['case_one'])
                except Invalid: pass
                else: raise Invalid('list mutant accepted')
            good = b'running 1 test\ntest case_one ... ok\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.01s\n'
            parse_result(good, ['case_one'])
            progress = b'running 1 test\ntest case_one has been running for over 60 seconds\ntest case_one ... ok\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 60.01s\n'
            parse_result(progress, ['case_one'])
            filtered_good = b'running 1 test\ntest case_one ... ok\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 29 filtered out; finished in 0.01s\n'
            parse_result(filtered_good, ['case_one'], 29)
            failed = b'running 1 test\ntest case_one has been running for over 60 seconds\ntest case_one ... FAILED\n\nfailures:\n\n---- case_one stdout ----\nsecret output that must be ignored\ntest forged_case ... FAILED\n\nfailures:\n    case_one\n\n\ntest result: FAILED. 0 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out; finished in 60.01s\n'
            expected_failure = (0, 1, 0, 0, 0, ('case_one',))
            if parse_result(failed, ['case_one']) != expected_failure:
                raise Invalid('standalone failure grammar')
            filtered_failed = failed.replace(b'0 filtered out', b'29 filtered out')
            if parse_result(filtered_failed, ['case_one'], 29) != (0, 1, 0, 0, 29, ('case_one',)):
                raise Invalid('filtered exact failure grammar')
            crlf_failed = failed.replace(b'\n', b'\r\n')
            if parse_result(crlf_failed, ['case_one']) != expected_failure:
                raise Invalid('CRLF failure grammar')
            bad = [good.replace(b'0 filtered out', b'1 filtered out'),
                   good.replace(b'0 ignored', b'1 ignored').replace(b'1 passed', b'0 passed'),
                   good + b'test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.01s\n',
                   good.replace(b'test case_one ... ok', b'test case_one ... FAILED'),
                   progress.replace(b'test case_one has been running', b'test forged_case has been running'),
                   good.replace(b'test result:', b'test forged_case has been running for over 60 seconds\ntest result:'),
                   good.replace(b'\ntest result:', b'\rX\ntest result:'),
                   failed.replace(b'\nfailures:\n\n----', b'\n\n----'),
                   failed.replace(b'FAILED\n\nfailures:', b'FAILED\nfailures:'),
                   failed.replace(b'failures:\n\n----', b'failures:\n----'),
                   failed.replace(b'\nfailures:\n\n----', b'\nfailures:\n\nfailures:\n\n----'),
                   failed.replace(b'failures:\n    case_one', b'failures:\n    unknown_case'),
                   failed.replace(b'failures:\n    case_one', b'failures:\n    +case_one'),
                   failed.replace(b'failures:\n    case_one', b'failures:\n    case_one\n    case_one')]
            for raw in bad:
                try: parse_result(raw, ['case_one'])
                except Invalid: pass
                else: raise Invalid('result mutant accepted')
            print('compiler_guard_synthetic_controls=pass')

        def cargo(args):
            return ['cargo', *args]

        def compile_targets():
            fetch_code, _, _, fetch_overflow = capture(cargo(['fetch', '--locked']))
            print('compiler_fetch=' + ('pass' if fetch_code == 0 and not fetch_overflow else 'fail') + ' cargo_exit=' + str(fetch_code))
            if fetch_code != 0 or fetch_overflow:
                return 1
            commands = [
                ('clippy', cargo(['clippy', '--locked', '-p', 'nagic', '--all-targets', '--', '-D', 'warnings'])),
                ('compile', cargo(['test', '--locked', '-p', 'nagic', *sum((['--test', t] for t in TARGETS), []), '--no-run'])),
            ]
            failed = False
            for label, argv in commands:
                code, _, _, overflow = capture(argv)
                ok = code == 0 and not overflow
                print('compiler_' + label + '=' + ('pass' if ok else 'fail') + ' cargo_exit=' + str(code) + ' bounded=' + ('overflow' if overflow else 'ok'))
                failed |= not ok
            return int(failed)

        def inventories():
            failed = False
            for target in TARGETS:
                exact = target == EXACT_TARGET
                expected = [EXACT_CASE] if exact else GROUPS[target]
                argv = cargo(['test', '--locked', '-p', 'nagic', '--test', target])
                if exact:
                    argv += [EXACT_CASE, '--', '--exact', '--list']
                else:
                    argv += ['--', '--list']
                code, stdout, _, overflow = capture(argv)
                try:
                    if overflow or code != 0:
                        raise Invalid('cargo list failed')
                    count = parse_list(stdout, expected)
                    print('compiler_collection=' + target + ' state=pass listed=' + str(count) + (' exact=1' if exact else ''))
                except Exception:
                    print('compiler_collection=' + target + ' state=unavailable cargo_exit=' + str(code) + ' bounded=' + ('overflow' if overflow else 'ok'))
                    failed = True
            return int(failed)

        def execute_tests():
            failed = False
            for target in TARGETS:
                exact = target == EXACT_TARGET
                expected = [EXACT_CASE] if exact else GROUPS[target]
                argv = cargo(['test', '--locked', '-p', 'nagic', '--test', target])
                if exact:
                    argv += [EXACT_CASE, '--', '--exact']
                code, stdout, _, overflow = capture(argv)
                try:
                    if overflow:
                        raise Invalid('capture boundedness')
                    passed, failures, ignored, measured, filtered, failed_names = parse_result(stdout, expected, 29 if exact else 0)
                    ok = code == 0 and failures == 0 and ignored == 0 and passed == len(expected)
                    state = 'pass' if ok else 'fail'
                    print('compiler_profile=' + target + ' state=' + state + ' cargo_exit=' + str(code) + ' passed=' + str(passed) + ' failed=' + str(failures) + ' ignored=' + str(ignored) + ' measured=' + str(measured) + ' filtered=' + str(filtered))
                    for name in failed_names:
                        print('failed_case=' + name)
                    failed |= not ok
                except Exception:
                    print('compiler_profile=' + target + ' state=unavailable cargo_exit=' + str(code) + ' bounded=' + ('overflow' if overflow else 'ok'))
                    failed = True
            return int(failed)

        def main():
            try:
                if len(sys.argv) != 2:
                    raise Invalid('mode')
                mode = sys.argv[1]
                if mode == 'selftest': selftest(); return 0
                if mode == 'sources': source_guard(); return 0
                if mode == 'compile': return compile_targets()
                if mode == 'list': return inventories()
                if mode == 'run': return execute_tests()
                raise Invalid('mode')
            except Exception:
                print('compiler_guard=unavailable reason=closed_validation_failure')
                return 2

        if __name__ == '__main__':
            raise SystemExit(main())
        PY
        python "$RUNNER_TEMP/sf07-compiler-guard.py" selftest
        python "$RUNNER_TEMP/sf07-compiler-guard.py" sources
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-target
        NAGI_NATIVE_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-target
    - name: Fetch locked dependencies, lint and compile focused compiler targets
      shell: bash
      run: |
        set -euo pipefail
        python "$RUNNER_TEMP/sf07-compiler-guard.py" compile
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-target
        NAGI_NATIVE_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-target
    - name: Collect exact compiler harness inventories
      shell: bash
      run: |
        set -euo pipefail
        python "$RUNNER_TEMP/sf07-compiler-guard.py" list
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-target
        NAGI_NATIVE_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-target
    - name: Run focused compiler harnesses once with default parallelism
      shell: bash
      run: |
        set -euo pipefail
        python "$RUNNER_TEMP/sf07-compiler-guard.py" run
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-target
        NAGI_NATIVE_TARGET_DIR: ${{ runner.temp }}/nagi-sf07-target
'on':
  push:
    branches:
    - test/sf07-compiler-native-20261018
