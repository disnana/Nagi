        TARGETS = ('http_stdlib', 'resource_contract_characterization', 'http_codegen', 'security_sf03_cors', 'security_sf04', 'error_routes', 'security_sf01_native', 'security_sf05_native', 'http_entrypoint', 'auth_boundaries', 'build_diagnostics')
