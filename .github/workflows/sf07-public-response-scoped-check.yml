          HASHES
      - name: Compile the complete migrated library tests first
        run: cargo test --locked -p nagi-runtime --lib --no-run
      - name: Verify exact public and lifetime test collection
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nagi-runtime --lib -- --list > "$RUNNER_TEMP/public-u4-tests.list"
          python - "$RUNNER_TEMP/public-u4-tests.list" <<'PY'
          import pathlib,sys
          actual={line.removesuffix(': test') for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.endswith(': test')}
          wanted=['http_server::response_public::tests::allow_serialization_preflights_before_allocation_and_keeps_405_close', 'http_server::response_public::tests::managed_header_refusal_keeps_denial_and_independent_fallback_exhaustion_closes', 'http_server::response_public::tests::missing_explicit_response_settings_and_later_incompatible_capacity_reject', 'http_server::response_public::tests::native_fault_classification_distinguishes_user_status_from_established_refusal', 'http_server::response_public::tests::prebuilt_fixture_adoption_keeps_same_claim_and_actual_bytes_owner_without_copy', 'http_server::response_public::tests::public_context_is_request_owned_and_json_has_distinct_body_and_work_limits', 'http_server::response_public::tests::public_first_request_header_owner_survives_native_join_and_permit_reuse', 'http_server::response_public::tests::public_mapper_failure_and_business_error_remain_distinct_completion_kinds', 'http_server::response_public::tests::retained_response_never_restores_old_cors_when_current_headers_or_fallback_are_full', 'http_server::response_public::tests::retained_same_producer_response_uses_current_request_cors_on_real_wire']
          exact=['http_server::request_headers::native_owner_tests::native_extensions_follow_last_header_view_and_drop_before_request_receipt', 'http_server::request_headers::tests::actual_native_parts_extensions_live_through_handler_and_drop_after_join']
          if {name for name in actual if name.startswith('http_server::response_public::tests::')} != set(wanted) or not set(exact)<=actual:
              raise SystemExit('exact public/lifetime inventory mismatch')
          if len({name for name in actual if name.startswith('http_server::response_attachment::')}) != 6 or len({name for name in actual if name.startswith('http_server::response_send::')}) != 10:
              raise SystemExit('affected native inventory mismatch')
          print('public_cases=10 lifetime_cases=2 inventory=passed')
          PY
      - name: Execute public response contracts once
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nagi-runtime --lib http_server::response_public::tests:: | tee "$RUNNER_TEMP/u4-public.log"
      - name: Execute exact native metadata lifetime regressions once
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nagi-runtime --lib http_server::request_headers::native_owner_tests::native_extensions_follow_last_header_view_and_drop_before_request_receipt -- --exact | tee "$RUNNER_TEMP/u4-owner.log"
          cargo test --locked -p nagi-runtime --lib http_server::request_headers::tests::actual_native_parts_extensions_live_through_handler_and_drop_after_join -- --exact | tee "$RUNNER_TEMP/u4-parts.log"
      - name: Execute previously verified affected native attachment and send cases once
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nagi-runtime --lib http_server::response_attachment:: | tee "$RUNNER_TEMP/u4-attachment.log"
          cargo test --locked -p nagi-runtime --lib http_server::response_send:: | tee "$RUNNER_TEMP/u4-send.log"
      - name: Enforce all selected executions without ignored or zero-test success
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1])
          for name,count in [('public',10),('owner',1),('parts',1),('attachment',6),('send',10)]:
              text=(root/('u4-'+name+'.log')).read_text()
              results=re.findall(r'test result: ok\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored;',text)
              if results!=[(str(count),'0','0')]:
                  raise SystemExit('exact runtime execution count mismatch: '+name)
          print('public=10 lifetime=2 attachment=6 send=10 executed=28 failed=0 ignored=0')
          PY
