name: SF07 public response scoped production check
on:
  push:
    branches:
      - test/sf07-u4-production-20261018
permissions:
  contents: read
jobs:
  production:
    if: github.ref == 'refs/heads/test/sf07-u4-production-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify parent and reviewed production source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "63da3783154d200373d5eee5321bc0000e0dda21"
          sha256sum --check <<'HASHES'
