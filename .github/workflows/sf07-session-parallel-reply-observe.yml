            code, calls, output, remaining = observe_with_fake_capture(staged_failure)
            assert code == 101 and len(calls) == 10 and remaining == 0
            assert 'session_full_failed_case=' + CASE + ' source=unavailable' in output
            assert 'phase=parallel_run state=failed cargo_exit=101' in output and 'projection=closed' in output
            assert 'csrf_public_assertion_diag' not in output and 'runtime/tests/' not in output
        
            exact_outside = [compile_ok, compile_ok, (0, unit_listing, False),
                             (0, parallel_listing, False), (0, exact_listing, False),
                             *unit_passes, (101, (good_diag + '\n').encode() + good_lf, False)]
            code, calls, output, remaining = observe_with_fake_capture(exact_outside)
            assert code == 101 and len(calls) == 9 and remaining == 0
            assert 'phase=exact_run state=unavailable cargo_exit=101' in output
            assert 'phase=parallel_run' not in output and 'projection=closed' not in output
            full_outside = [compile_ok, compile_ok, (0, unit_listing, False),
                            (0, parallel_listing, False), (0, exact_listing, False),
                            *unit_passes, (0, raw('ok'), False),
                            (101, parallel_failure + (good_diag + '\n').encode(), False)]
            code, calls, output, remaining = observe_with_fake_capture(full_outside)
            assert code == 101 and len(calls) == 10 and remaining == 0
            assert 'phase=parallel_run state=unavailable cargo_exit=101' in output
            assert 'csrf_public_assertion_diag' not in output and 'projection=closed' not in output
        
            guarded_failure = raw(diag=good_diag + '\n' + valid_guard)
            guarded_stage = [compile_ok, compile_ok, (0, unit_listing, False),
                             (0, parallel_listing, False), (0, exact_listing, False),
                             *unit_passes, (101, guarded_failure, False)]
            code, calls, output, remaining = observe_with_fake_capture(guarded_stage)
            assert code == 101 and len(calls) == 9 and remaining == 0
            assert 'session_guarded_deadline_diag case=' + CASE + ' state=closed samples=1' in output
            assert 'csrf_guarded_deadline_diag' not in output and 'synthetic_secret' not in output
        
            assert parse_guarded_deadline_block(guarded_failure, CASE, 1) is not None
            exact_overflow = [compile_ok, compile_ok, (0, unit_listing, False),
                              (0, parallel_listing, False), (0, exact_listing, False),
                              *unit_passes, (101, guarded_failure, True)]
            code, calls, output, remaining = observe_with_fake_capture(exact_overflow)
            assert code == 101 and len(calls) == 9 and remaining == 0
            assert 'phase=exact_run state=unavailable cargo_exit=101' in output
            assert 'session_guarded_deadline_diag case=' + CASE + ' state=unavailable capture=overflow' in output
            assert 'session_guarded_deadline_diag case=' + CASE + ' state=closed' not in output
            assert 'phase=parallel_run' not in output
        
            full_guarded_failure = full_run(failed_cases=(CASE,), diagnostics={CASE: good_diag + '\n' + valid_guard})
            assert parse_guarded_deadline_block(full_guarded_failure, CASE, len(FULL_CASES)) is not None
            full_overflow = [compile_ok, compile_ok, (0, unit_listing, False),
                             (0, parallel_listing, False), (0, exact_listing, False),
                             *unit_passes, (0, raw('ok'), False), (101, full_guarded_failure, True)]
            code, calls, output, remaining = observe_with_fake_capture(full_overflow)
            assert code == 101 and len(calls) == 10 and remaining == 0
            assert 'phase=parallel_run state=unavailable cargo_exit=101' in output
            assert 'session_guarded_deadline_diag case=' + CASE + ' state=unavailable capture=overflow' in output
            assert 'session_guarded_deadline_diag case=' + CASE + ' state=closed' not in output
        
            invalid_diags = [
                good_diag + ' extra=Bearer synthetic_secret',
                good_diag.replace('status_one=200', 'status_one=099'),
                good_diag.replace('status_two=403', 'status_two=600'),
                good_diag.replace('calls_at_failure=2', 'calls_at_failure=1025'),
                good_diag.replace('checked_calls=Some(1)', 'checked_calls=Some(0001)'),
                good_diag + '\n' + good_diag,
                'csrf_public_assertion_diag phase=Other status_one=200 status_two=403 checked_calls=None calls_at_failure=2 checked_rows=None',
            ]
            for item in invalid_diags:
                parsed_state, parsed_diag = parse_run(raw(diag=item), 101)
                assert parsed_state == 'failed' and parsed_diag is None
                projected = fields(parsed_diag)
                assert 'synthetic_secret' not in projected and 'Bearer' not in projected
                assert 'runtime/' not in projected and 'session_csrf_public_api.rs' not in projected
            wrong_case = raw(diag=good_diag, case='other_known_case', trailer='failures:\n    other_known_case\n')
            try:
                parse_run(wrong_case, 101)
            except Invalid:
                pass
            else:
                raise AssertionError('wrong test case accepted')
            missing = parse_run(raw(diag=None), 101)
            assert missing == ('failed', None)
            unavailable = fields(None)
            assert all(part + '=unavailable' in unavailable for part in
                       ('status_one', 'status_two', 'checked_calls', 'calls_at_failure', 'checked_rows'))
            for code, output in ((0, good_lf), (101, raw('ok'))):
                try:
                    parse_run(output, code)
                except Invalid:
                    pass
                else:
                    raise AssertionError('cargo/result exit mismatch accepted')
            for bad in (b'\xff', b'running 1 test\rtest\r'):
                try:
                    normalized(bad)
                except (Invalid, UnicodeDecodeError):
                    pass
                else:
                    raise AssertionError('invalid encoding/line ending accepted')
            print('selftest=pass cfg_inventory=11 optin_case=exact filtered=10 unit_inventory=dynamic selected=3 unit_exit=closed guarded_schema=15fields records_max=8 foreign_block=unavailable LF_CRLF=pass existing_failure_association=closed exits=strict')
        
        
        def _unit_target() -> list[str]:
            return ['-p', 'nagi-runtime', '--lib']
        
        
        def _session_target() -> list[str]:
            return ['-p', 'nagi-runtime', '--test', 'session_csrf_public_api']
        
        
        def _emit_guarded_deadline(raw: bytes, running_count: int, overflow: bool) -> None:
            if overflow:
                print('session_guarded_deadline_diag case=' + CASE + ' state=unavailable capture=overflow')
                return
            records = parse_guarded_deadline_block(raw, CASE, running_count)
            if records is None:
                print('session_guarded_deadline_diag case=' + CASE + ' state=unavailable')
                return
            print('session_guarded_deadline_diag case=' + CASE + ' state=closed samples=' + str(len(records)))
            for index, record in enumerate(records, 1):
                values = ' '.join(key + '=' + str(record[key]) for key in GUARDED_FIELDS)
                print('session_guarded_deadline_diag case=' + CASE + ' sample_index=' + str(index) + ' ' + values)
        
        
        def _run_unit_cases(unit_count: int) -> int:
            failed_code = 0
            target = _unit_target()
            filtered = unit_count - 1
            for case in UNIT_CASES:
                args = ['cargo', 'test', '--locked', *target, case, '--', '--exact']
                code, output, overflow = capture(args, OUTPUT_LIMIT)
                try:
                    if overflow:
                        raise Invalid('unit output overflow')
                    state = parse_unit_run(output, code, case, filtered)
                except Exception:
                    print('session_guard_unit case=' + case + ' state=unavailable cargo_exit=' + str(code)
                          + ' capture=' + ('overflow' if overflow else 'bounded') + ' output=closed')
                    if failed_code == 0:
                        failed_code = code if code else 2
                    continue
                if state == 'passed':
                    print('session_guard_unit case=' + case + ' state=passed cargo_exit=0 filtered=' + str(filtered))
                else:
                    print('session_guard_unit case=' + case + ' state=failed cargo_exit=' + str(code)
                          + ' filtered=' + str(filtered) + ' output=closed')
                    if failed_code == 0:
                        failed_code = code if code else 2
            return failed_code
        
        
        def observe() -> int:
            try:
                source_guard()
            except Exception:
                print('session_parallel_reply phase=source_guard state=unavailable')
                return 2
        
            unit_target = _unit_target()
            session_target = _session_target()
            compile_commands = (
                ('runtime_unit_compile', ['cargo', 'test', '--locked', *unit_target, '--no-run']),
                ('session_compile', ['cargo', 'test', '--locked', *session_target, '--no-run']),
            )
            for label, args in compile_commands:
                code, _, overflow = capture(args, INFRA_LIMIT)
                print('session_parallel_reply phase=' + label + ' state=' + ('pass' if code == 0 and not overflow else 'fail')
                      + ' cargo_exit=' + str(code) + ' capture=' + ('overflow' if overflow else 'bounded'))
                if code != 0 or overflow:
                    return code if code else 2
        
            # Collect actual complete inventories before any selected execution. The unit
            # filtered count is computed only from this same target's full --list output.
            unit_list_args = ['cargo', 'test', '--locked', *unit_target, '--', '--list']
            code, listing, overflow = capture(unit_list_args, INFRA_LIMIT)
            try:
                if code != 0 or overflow:
                    raise Invalid('unit list process')
                unit_count = parse_unit_listing(listing)
            except Exception as error:
                reason = str(error) if isinstance(error, Invalid) else 'internal'
                allowed = {'unit list process', 'unit inventory empty', 'unit inventory footer',
                           'unit inventory row', 'unit inventory count', 'unit case identity',
                           'bare carriage return', 'internal'}
                reason = reason.replace(' ', '_') if reason in allowed else 'internal'
                print('session_parallel_reply phase=unit_collection state=unavailable cargo_exit=' + str(code)
                      + ' capture=' + ('overflow' if overflow else 'bounded') + ' reason=' + reason)
                return code if code else 2
            print('session_parallel_reply phase=unit_collection state=pass total=' + str(unit_count)
                  + ' selected=' + str(len(UNIT_CASES)) + ' filtered_execution=' + str(unit_count - 1))
        
            full_list_args = ['cargo', 'test', '--locked', *session_target, '--', '--list']
            code, listing, overflow = capture(full_list_args, OUTPUT_LIMIT)
            try:
                if code != 0 or overflow:
                    raise Invalid('full list process')
                parse_full_listing(listing)
            except Exception:
                print('session_parallel_reply phase=parallel_collection state=unavailable cargo_exit=' + str(code)
                      + ' capture=' + ('overflow' if overflow else 'bounded'))
                return code if code else 2
            print('session_parallel_reply phase=parallel_collection state=pass cases=' + str(len(FULL_CASES)) + ' filtered=0')
        
            list_args = ['cargo', 'test', '--locked', *session_target, CASE, '--', '--exact', '--list']
            code, listing, overflow = capture(list_args, OUTPUT_LIMIT)
            try:
                if code != 0 or overflow:
                    raise Invalid('exact list process')
                parse_listing(listing)
            except Exception:
                print('session_parallel_reply phase=exact_collection state=unavailable cargo_exit=' + str(code)
                      + ' capture=' + ('overflow' if overflow else 'bounded'))
                return code if code else 2
            print('session_parallel_reply phase=exact_collection state=pass exact_cases=1 filtered_execution='
                  + str(len(FULL_CASES) - 1))
        
            unit_status = _run_unit_cases(unit_count)
            if unit_status != 0:
                return unit_status
        
            run_args = ['cargo', 'test', '--locked', *session_target, CASE, '--', '--exact']
            code, output, overflow = capture(run_args, OUTPUT_LIMIT)
            try:
                if overflow:
                    raise Invalid('exact run capture overflow')
                state, diag = parse_run(output, code)
                if state == 'passed' and 'csrf_guarded_deadline_diag' in normalized(output):
                    raise Invalid('guarded diagnostic in passing test')
            except Exception:
                print('session_parallel_reply phase=exact_run state=unavailable cargo_exit=' + str(code)
                      + ' status_one=unavailable status_two=unavailable checked_calls=unavailable '
                      + 'calls_at_failure=unavailable checked_rows=unavailable projection=unavailable '
                      + 'capture=' + ('overflow' if overflow else 'bounded'))
                if code != 0:
                    _emit_guarded_deadline(output, 1, overflow)
                return code if code else 2
            if state != 'passed':
                print('session_parallel_reply phase=exact_run state=failed cargo_exit=' + str(code) + ' ' + fields(diag))
                _emit_guarded_deadline(output, 1, overflow)
                return code if code else 2
            print('session_parallel_reply phase=exact_run state=passed cargo_exit=0 '
                  'status_one=unavailable status_two=unavailable checked_calls=unavailable '
                  'calls_at_failure=unavailable checked_rows=unavailable projection=not_applicable')
        
            # Deliberately omit filters and test-thread overrides: this is one ordinary
            # default-parallel invocation, conditional on the exact case passing above.
            full_run_args = ['cargo', 'test', '--locked', *session_target]
            code, output, overflow = capture(full_run_args, OUTPUT_LIMIT)
            try:
                if overflow:
                    raise Invalid('parallel run capture overflow')
                state, failed_cases, diag = parse_full_run(output, code)
                if state == 'passed' and 'csrf_guarded_deadline_diag' in normalized(output):
                    raise Invalid('guarded diagnostic in passing full run')
            except Exception:
                print('session_parallel_reply phase=parallel_run state=unavailable cargo_exit=' + str(code)
                      + ' status_one=unavailable status_two=unavailable checked_calls=unavailable '
                      + 'calls_at_failure=unavailable checked_rows=unavailable projection=unavailable '
                      + 'capture=' + ('overflow' if overflow else 'bounded'))
                if code != 0:
                    _emit_guarded_deadline(output, len(FULL_CASES), overflow)
                return code if code else 2
            if state == 'passed':
                print('session_parallel_reply phase=parallel_run state=passed cargo_exit=0 cases=' + str(len(FULL_CASES)) + ' failed=0 ignored=0')
                return 0
            for name in failed_cases:
                print('session_full_failed_case=' + name + ' source=unavailable')
            if CASE in failed_cases:
                print('session_parallel_reply phase=parallel_run state=failed cargo_exit=' + str(code) + ' ' + fields(diag))
                _emit_guarded_deadline(output, len(FULL_CASES), overflow)
            else:
                print('session_parallel_reply phase=parallel_run state=expected_case_not_failed cargo_exit=' + str(code)
                      + ' ' + fields(None))
                if 'csrf_guarded_deadline_diag' in normalized(output):
                    _emit_guarded_deadline(output, len(FULL_CASES), overflow)
            return code if code else 2
        
        
        def main() -> int:
            if len(sys.argv) != 2:
                print('session_parallel_reply state=unavailable')
                return 2
            if sys.argv[1] == 'selftest':
                try:
                    selftest()
                    return 0
                except Exception:
                    print('selftest=fail')
                    return 1
            if sys.argv[1] == 'observe':
                return observe()
            print('session_parallel_reply state=unavailable')
            return 2
        
        if __name__ == '__main__':
            raise SystemExit(main())
        PY
        python "$RUNNER_TEMP/sf07-session-parallel-reply-guard.py" selftest
        python "$RUNNER_TEMP/sf07-session-parallel-reply-guard.py" observe
