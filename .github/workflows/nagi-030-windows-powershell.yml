name: Nagi 0.3.0 native PowerShell installers

on:
  push:
    branches: [ci/nagi-030-candidate-validation]
    paths:
      - .github/workflows/nagi-030-windows-powershell.yml

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'disnana/Nagi' && github.event_name == 'push' && github.ref == 'refs/heads/ci/nagi-030-candidate-validation' && github.event.repository.visibility == 'public'
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      NAGI_GO: go
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dfd1e6786031e1cb38b1d5792553b913f1db0469
          persist-credentials: false
          path: source
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify normal checkout and build the exact Windows archive
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dfd1e6786031e1cb38b1d5792553b913f1db0469
          test "$(git rev-parse HEAD^{tree})" = 46a89c9475d105ae65550989cb9f36a503e6bcbb
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-pc-windows-msvc
          git ls-files --eol -- compiler/src/go_backend/{cors,http}.go
          test "$(git ls-files --eol -- compiler/src/go_backend/{cors,http}.go | grep -c 'w/lf')" = 2
          cargo fetch --locked --target x86_64-pc-windows-msvc >"$RUNNER_TEMP/fetch.log" 2>&1
          cargo build --release --locked -p nagic >"$RUNNER_TEMP/build.log" 2>&1
          python -B scripts/releases/package.py --binary target/release/nagic.exe --version 0.3.0 --platform windows-x86_64 >"$RUNNER_TEMP/package.log" 2>&1
      - name: Windows PowerShell 5.1 install and upgrade
        working-directory: source
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          ./scripts/releases/test_install.ps1 -Archive 'build/distribution/nagi-0.3.0-windows-x86_64.zip' -Version 0.3.0 -TestUserPath
      - name: Windows PowerShell 5.1 uninstall
        if: success() || failure()
        working-directory: source
        shell: powershell
        run: ./scripts/releases/test_uninstall.ps1
      - name: PowerShell 7 install and upgrade
        if: success() || failure()
        working-directory: source
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'Expected PowerShell 7' }
          ./scripts/releases/test_install.ps1 -Archive 'build/distribution/nagi-0.3.0-windows-x86_64.zip' -Version 0.3.0 -TestUserPath
      - name: PowerShell 7 uninstall
        if: success() || failure()
        working-directory: source
        shell: pwsh
        run: ./scripts/releases/test_uninstall.ps1
