      - name: Format and production runtime typecheck
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nagi020-coherent-target
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --locked -p nagi-runtime
      - name: Compile every runtime test without running the known failing Session suite
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nagi020-coherent-target
        run: |
          set -euo pipefail
          cargo test --locked -p nagi-runtime --no-run
      - name: Check migrated protected operation startup against the actual dispatcher
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nagi-runtime --lib http_client::startup_tests::protected_registered_operation_preserves_actual_request_grant_target_and_startup_credential -- --exact --list > "$RUNNER_TEMP/coherent-startup-case.list"
          python3 - <<'PY_LIST'
          import os, pathlib
          lines=[x for x in pathlib.Path(os.environ['RUNNER_TEMP'], 'coherent-startup-case.list').read_text().splitlines() if x]
          assert lines == ['http_client::startup_tests::protected_registered_operation_preserves_actual_request_grant_target_and_startup_credential: test', '1 test, 0 benchmarks']
          PY_LIST
          cargo test --locked -p nagi-runtime --lib http_client::startup_tests::protected_registered_operation_preserves_actual_request_grant_target_and_startup_credential -- --exact 2>&1 | tee "$RUNNER_TEMP/coherent-startup-case.log"
          python3 - <<'PY_RUN'
          import os, pathlib, re
          text=pathlib.Path(os.environ['RUNNER_TEMP'], 'coherent-startup-case.log').read_text()
          rows=re.findall(r'(?m)^test ([^\n]+) \.\.\. (ok|FAILED|ignored)$',text)
          assert rows == [('http_client::startup_tests::protected_registered_operation_preserves_actual_request_grant_target_and_startup_credential','ok')]
          summary=re.findall(r'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;',text)
          assert summary == [('ok','1','0','0')]
          print('coherent_startup_dispatch=pass exact=1 source=request_context_and_finite_budgets')
          PY_RUN
      - name: Check the integrated fixed Ed25519 profile
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nagi020-coherent-target
        run: |
          set -euo pipefail
          cargo test --locked -p nagi-runtime --lib auth::ed25519:: 2>&1 | tee "$RUNNER_TEMP/coherent-ed25519-core.log"
          cargo test --locked -p nagi-runtime --test ed25519_public_api 2>&1 | tee "$RUNNER_TEMP/coherent-ed25519-public.log"
          python3 - <<'PY_ED'
          import os, pathlib, re
          for name,count in [('coherent-ed25519-core.log',14),('coherent-ed25519-public.log',1)]:
              text=pathlib.Path(os.environ['RUNNER_TEMP'],name).read_text(encoding='utf-8')
              actual=re.findall(r'test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;',text)
              assert actual==[('ok',str(count),'0','0')], name
              lines=re.findall(r'(?m)^test [^\n]+ \.\.\. (ok|FAILED)$',text)
              assert lines==['ok']*count, name
          print('coherent_ed25519=pass core=14 public=1')
          PY_ED
      - name: Refresh the standalone fixture lock through Cargo and build it
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nagi020-coherent-target
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/coherent-root.lock"
          cp tools/sf08-fixture-runtime/Cargo.lock "$RUNNER_TEMP/sf08-previous.lock"
          cp Cargo.lock tools/sf08-fixture-runtime/Cargo.lock
          cargo metadata --manifest-path tools/sf08-fixture-runtime/Cargo.toml --format-version 1 --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/sf08-metadata.json"
          python3 - <<'PY'
          import hashlib, os, pathlib, re, tomllib

          def validate_lock(root_raw, raw):
              assert 0 < len(raw) <= 262144 and raw.isascii()
              root=tomllib.loads(root_raw.decode('utf-8'))
              doc=tomllib.loads(raw.decode('ascii'))
              assert set(doc)=={'version','package'} and doc['version']==4
              assert isinstance(doc['package'],list) and len(doc['package'])<=len(root['package'])+1
              allowed_comments={'# This file is automatically @generated by Cargo.', '# It is not intended for manual editing.'}
              for line in raw.decode('ascii').splitlines():
                  if '#' in line: assert line.strip() in allowed_comments
              def key(v): return (v['name'],v['version'],v.get('source'),v.get('checksum'))
              known={key(x) for x in root['package']}
              dependency_refs={x['name'] for x in root['package']}|{x['name']+' '+x['version'] for x in root['package']}
              seen=set()
              for row in doc['package']:
                  assert set(row)<={'name','version','source','checksum','dependencies'}
                  assert {'name','version'}<=set(row)
                  assert isinstance(row['name'],str) and re.fullmatch(r'[A-Za-z0-9_-]{1,128}',row['name'])
                  identity=key(row)
                  assert identity not in seen
                  seen.add(identity)
                  if row['name']=='nagi-sf08-fixture-runtime':
                      assert row['version']=='0.0.0' and 'source' not in row and 'checksum' not in row
                  else:
                      assert identity in known, 'standalone graph drift'
                  dependencies=row.get('dependencies',[])
                  assert isinstance(dependencies,list) and len(dependencies)<=len(root['package'])
                  assert all(isinstance(dep,str) and dep in dependency_refs for dep in dependencies)
                  assert len(set(dependencies))==len(dependencies)
                  if row['name']=='nagi-sf08-fixture-runtime':
                      assert {dep.split(' ')[0] for dep in dependencies}=={'nagi-runtime','tokio'}
                  if 'source' in row:
                      assert row['source']=='registry+https://github.com/rust-lang/crates.io-index'
                      assert re.fullmatch(r'[0-9a-f]{64}',row['checksum'])
                  else:
                      assert row['name'] in ('nagi-runtime','nagi-sf08-fixture-runtime')
              return doc

          old=pathlib.Path(os.environ['RUNNER_TEMP'],'coherent-root.lock').read_bytes()
          assert pathlib.Path('Cargo.lock').read_bytes()==old
          p=pathlib.Path('tools/sf08-fixture-runtime/Cargo.lock')
          with p.open('rb') as f: raw=f.read(262145)
          doc=validate_lock(old,raw)
          pathlib.Path(os.environ['RUNNER_TEMP'],'sf08-validated-lock.json').write_text(
              __import__('json').dumps({'size':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),'root_sha256':hashlib.sha256(old).hexdigest()}))
          print('standalone_lock_graph=pass unchanged_root=pass packages='+str(len(doc['package'])))
          PY
          cargo check --locked --manifest-path tools/sf08-fixture-runtime/Cargo.toml
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib
          expected=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'sf08-validated-lock.json').read_text())
          assert hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest()==expected['root_sha256']
          with pathlib.Path('tools/sf08-fixture-runtime/Cargo.lock').open('rb') as stream: raw=stream.read(262145)
          assert len(raw)==expected['size']<=262144 and raw.isascii()
          assert hashlib.sha256(raw).hexdigest()==expected['sha256']
          print('NAGI_SF08_LOCK_BEGIN '+str(len(raw))+' '+hashlib.sha256(raw).hexdigest())
          data=base64.b64encode(raw).decode('ascii')
          for at in range(0,len(data),1024): print('NAGI_SF08_LOCK_DATA '+data[at:at+1024])
          print('NAGI_SF08_LOCK_END')
          PY
