name: Nagi project tooling

on:
  pull_request:
    paths:
      - 'scripts/generate_project_ci.py'
      - 'scripts/verify_build_receipt.py'
      - 'scripts/tests/test_generate_project_ci.py'
      - 'scripts/tests/test_build_receipt.py'
      - '.github/workflows/project-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_project_ci.py'
      - 'scripts/verify_build_receipt.py'
      - 'scripts/tests/test_generate_project_ci.py'
      - 'scripts/tests/test_build_receipt.py'
      - '.github/workflows/project-tooling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Project tools (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check user-project CI generation and build receipt validation
        run: |
          python -m unittest discover -s scripts/tests -p 'test_generate_project_ci.py'
          python -m unittest discover -s scripts/tests -p 'test_build_receipt.py'
