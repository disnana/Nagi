name: Nagi 0.3.0 Linux x64 installed CLI

on:
  push:
    branches: [ci/nagi-030-candidate-validation]
    paths: [.github/workflows/nagi-030-linux-install.yml]

permissions:
  contents: read

jobs:
  install:
    if: github.repository == 'disnana/Nagi' && github.event_name == 'push' && github.ref == 'refs/heads/ci/nagi-030-candidate-validation' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      GOTOOLCHAIN: local
      GOWORK: 'off'
      NAGI_GO: go
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d8fadadd1f64b7c4d7ee20585fbd4fa287b12a81
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build the exact native archive
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d8fadadd1f64b7c4d7ee20585fbd4fa287b12a81
          test "$(git rev-parse HEAD^{tree})" = 2e9837dc317828f9b73b2d27b11d64215063f25c
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          cargo fetch --locked --target x86_64-unknown-linux-gnu >"$RUNNER_TEMP/fetch.log" 2>&1
          cargo build --release --locked -p nagic >"$RUNNER_TEMP/build.log" 2>&1
          python -B scripts/releases/package.py --binary target/release/nagic --version 0.3.0 --platform linux-x86_64 >"$RUNNER_TEMP/package.log" 2>&1
      - name: Verify installed default Rust and opt-in Go in an external project
        shell: bash
        run: |
          set -euo pipefail
          unset NAGI_ROOT ICU4X_DATA_DIR
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export NAGI_NATIVE_TARGET_DIR="$GITHUB_WORKSPACE/source/native-target"
          rc=0
          python -B control/scripts/ci/public_candidate_install.py source source/build/distribution/nagi-0.3.0-linux-x86_64.tar.gz >"$RUNNER_TEMP/install.log" 2>&1 || rc=$?
          python - "$RUNNER_TEMP/install.log" <<'PY'
          import re, sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          allowed = {
              "Verified installed CLI rust-default: exit 0 and exact output",
              "Verified installed CLI go-opt-in: exit 0 and exact output",
              "Verified native install, reinstall, version, and uninstall for linux-x86_64",
          }
          for line in lines:
              if line in allowed:
                  print(line)
              if marker := re.search(r'public_candidate_install\.py", line (\d+)', line):
                  print("Install harness failure at line " + marker[1])
          PY
          exit "$rc"
