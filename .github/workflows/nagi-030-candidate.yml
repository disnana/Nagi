name: Nagi 0.3.0 candidate validation

on:
  push:
    branches: [ci/nagi-030-candidate-validation]
    paths:
      - .github/workflows/nagi-030-candidate.yml
      - scripts/ci/public_candidate_validation.py
      - scripts/ci/public_candidate_install.py

permissions:
  contents: read

concurrency:
  group: nagi-030-candidate-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'disnana/Nagi' && github.event_name == 'push' && github.ref == 'refs/heads/ci/nagi-030-candidate-validation' && github.event.repository.visibility == 'public'
    name: Candidate on ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x86_64, runner: ubuntu-24.04, rust_host: x86_64-unknown-linux-gnu, go_tests: 37}
          - {platform: windows-x86_64, runner: windows-2025, rust_host: x86_64-pc-windows-msvc, go_tests: 36}
          - {platform: macos-x86_64, runner: macos-15-intel, rust_host: x86_64-apple-darwin, go_tests: 37}
          - {platform: macos-arm64, runner: macos-15, rust_host: aarch64-apple-darwin, go_tests: 37}
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      NAGI_GO: go
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d8fadadd1f64b7c4d7ee20585fbd4fa287b12a81
          fetch-depth: ${{ matrix.platform == 'linux-x86_64' && '0' || '4' }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate the candidate and its native CLI
        run: python control/scripts/ci/public_candidate_validation.py source evidence ${{ matrix.platform }} ${{ matrix.rust_host }} ${{ matrix.go_tests }}
