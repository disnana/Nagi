name: Nagi JetBrains plugin

on:
  workflow_call:
    inputs:
      release_version:
        description: Version selected from the checked-out source commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional expected plugin version (defaults to Gradle source)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jetbrains-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: JetBrains (${{ matrix.product }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: IntelliJ IDEA
            platformType: IC
            platformVersion: '2025.1.1'
            minimumPlatformVersion: '2024.3.7'
          - product: PyCharm
            platformType: PC
            platformVersion: '2025.1.1'
            minimumPlatformVersion: '2024.3.6'
    defaults:
      run:
        working-directory: editors/jetbrains-nagi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Resolve the expected JetBrains plugin version
        id: release-version
        env:
          PROVIDED_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$PROVIDED_VERSION" ]; then
            echo "version=$PROVIDED_VERSION" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, '../../scripts/releases')
          from plan import versions
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"version={versions(commit)['jetbrains']}\n")
          PY
          fi
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        id: rust
      - name: Cache the compiler for integration checks
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: nagi-jetbrains-compiler-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-jetbrains-compiler-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
      - name: Build the current compiler for integration checks
        working-directory: .
        run: cargo build --locked -p nagic
      - name: Test, package, and verify the selected IDE
        env:
          NAGI_TEST_COMPILER: ${{ github.workspace }}/target/debug/nagic
        run: >-
          ./gradlew --no-daemon --stacktrace test buildPlugin verifyPlugin
          -PplatformType=${{ matrix.platformType }}
          -PplatformVersion=${{ matrix.platformVersion }}
          -PminimumPlatformVersion=${{ matrix.minimumPlatformVersion }}
      - name: Verify the ZIP descriptor and prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
          PLATFORM_TYPE: ${{ matrix.platformType }}
        run: >-
          python ../../scripts/releases/jetbrains.py
          --archive "build/distributions/nagi-jetbrains-$RELEASE_VERSION.zip"
          --output ../../build/release-assets
          --platform-type "$PLATFORM_TYPE"
          --version "$RELEASE_VERSION"
      - name: Upload the verified plugin and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-jetbrains-${{ matrix.platformType }}
          path: |
            build/release-assets/nagi-jetbrains-${{ matrix.platformType }}-*.zip
            build/release-assets/nagi-jetbrains-${{ matrix.platformType }}-*.zip.sha256
          if-no-files-found: error
      - name: Upload test and compatibility reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nagi-jetbrains-reports-${{ matrix.platformType }}
          path: |
            editors/jetbrains-nagi/build/reports/tests/
            editors/jetbrains-nagi/build/test-results/
            editors/jetbrains-nagi/build/reports/pluginVerifier/
          if-no-files-found: warn
