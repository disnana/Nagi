              text = (root / name).read_text(encoding="utf-8")
              pattern = rf"test result: ok\. {count} passed; 0 failed; 0 ignored;"
              if not re.search(pattern, text):
                  raise AssertionError(f"{name}: expected {count} passed, 0 failed, 0 ignored")
          PY
      - name: Check SF05 Query migration and protected native SQL on the target platform
        shell: bash
        env:
          NAGI_TEST_ARTIFACT_DIR: ${{ github.workspace }}/build/security-sf05/native
          SF05_PLATFORM: ${{ matrix.platform }}
        run: |
          set -o pipefail
          mkdir -p build/security-sf05
          cargo test --locked -p nagic --test security_sf05 2>&1 | tee "build/security-sf05/sf05-checker.log"
          cargo test --locked -p nagic --test security_sf05_native 2>&1 | tee "build/security-sf05/sf05-native.log"
          cargo test --locked -p nagi-runtime --lib sqlite::security_sf05_tests:: 2>&1 | tee "build/security-sf05/sf05-admission.log"
          python -c 'import pathlib,re,os; root=pathlib.Path("build/security-sf05"); counts={"sf05-checker.log":13,"sf05-native.log":1,"sf05-admission.log":6}; [(None if re.search(r"test result: ok\. %d passed; 0 failed; 0 ignored;"%n,(root/f).read_text()) else (_ for _ in ()).throw(AssertionError(f))) for f,n in counts.items()]'
          python benchmarks/security-sf05/ci_provenance.py build/security-sf05
      - name: Preserve SF05 source identity and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-sf05-${{ matrix.platform }}
          path: build/security-sf05/
          if-no-files-found: warn
      - name: Check SQLite High and handwritten Low contract registration
        run: cargo test --locked -p nagic --test sqlite_contract_inputs
      - name: Verify bilingual first-app tutorial in High and saved Low
        run: python scripts/verify_onboarding_examples.py
      - name: Check planned SQLite runner stage and source-location oracles
        run: cargo test --locked -p nagic --example sqlite-contract-check
      - name: Check SQLite contracts and native High, saved Low and handwritten Low
        shell: bash
        run: |
          cargo run --locked -p nagic --example sqlite-contract-check -- --report "$RUNNER_TEMP/sqlite-contracts.json"
          cargo test --locked -p nagic --test sqlite_public
      - name: Check public Task bridge lifecycle on the target platform
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nagi-runtime --lib task::tests:: 2>&1 | tee "$RUNNER_TEMP/task-runtime.log"
          python -c 'import pathlib,re,os; text=pathlib.Path(os.environ["RUNNER_TEMP"],"task-runtime.log").read_text(); assert re.search(r"test result: ok\. 17 passed; 0 failed; 0 ignored;",text),text'
          cargo test --locked -p nagi-runtime --test task_handles
          cargo test --locked -p nagi-runtime --doc

      - name: Check Task checker contracts on the target platform
        shell: bash
        run: cargo run --locked -p nagic --example task-contract-red -- --report "$RUNNER_TEMP/task-contracts.json"
      - name: Check Task examples in High, saved Low and handwritten Low
        run: python scripts/verify_library_examples.py --only task-results
      - name: Check typed monitor and HTTP service in all three forms
        run: python scripts/verify_library_examples.py --only supervised-service
      - name: Check successful application artifact selection
        run: python -m unittest discover -s scripts -p 'test_native_artifacts.py'
      - name: Check Axum native test execution and result validation
        run: python -m unittest discover -s scripts -p 'test_application_native_tests.py'
      - name: Check oversized HTTP bodies and connection recovery on the target platform
        run: cargo test --locked -p nagi-runtime oversized_body_ -- --test-threads=1 --nocapture
      - name: Check HTTP panic recovery on the target platform
        run: cargo test --locked -p nagi-runtime panic_ -- --test-threads=1
      - name: Check HTTP handler deadlines on the target platform
        run: cargo test --locked -p nagi-runtime handler_timeout_ -- --test-threads=1
      - name: Check demo packaging with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/build_windows_demo.ps1 -Source examples/hello.nagi -Offline
          $output = & ./build/distribution/nagi-hello.exe
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'Hello, Nagi!') { throw 'Packaged Hello failed.' }
      - name: Check demo packaging with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build_windows_demo.ps1 -Source examples/hello.nagi -Offline
          $output = & ./build/distribution/nagi-hello.exe
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'Hello, Nagi!') { throw 'Packaged Hello failed.' }
          ./test-nagi-code/build_fractal_exe.ps1 -Offline
          $output = 'q' | & ./build/distribution/nagi-fractal.exe
          if ($LASTEXITCODE -ne 0 -or -not ($output -match 'Goodbye!')) { throw 'Packaged fractal failed.' }
      - name: Package tracked source and the compiler
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
        shell: bash
        run: python scripts/releases/package.py --binary "target/release/$RELEASE_EXECUTABLE" --version "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM"
      - name: Verify an extracted distribution outside the checkout
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/releases')
          from verify import verify
          version, platform = os.environ['RELEASE_VERSION'], os.environ['RELEASE_PLATFORM']
          suffix = '.zip' if os.name == 'nt' else '.tar.gz'
          verify(Path('build/distribution') / f'nagi-{version}-{platform}{suffix}', version, platform, Path('native-target'))
          PY
      - name: Check HTTP route parameters on the target platform
        run: python tests/route_integration.py
      - name: Check standard HTTP High and saved Low on the target platform
        run: python tests/http_stdlib_integration.py
      - name: Check scoped task captures on the target platform
        run: cargo test --locked -p nagic --test scoped_tasks
      - name: Check actor lifecycle and supervisor cancellation on the target platform
        run: |
          cargo test --locked -p nagi-runtime actor::
          cargo test --locked -p nagi-runtime supervisor_drop
      - name: Check SQLite row counts on the target platform
        run: cargo test --locked -p nagi-runtime database::tests
      - name: Check public SQLite session cleanup, cancellation and close on the target platform
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p nagi-runtime --lib sqlite:: 2>&1 | tee "$RUNNER_TEMP/sqlite-runtime.log"
          python scripts/ci/assert_sqlite_test_summary.py "$RUNNER_TEMP/sqlite-runtime.log"
          cargo test --locked -p nagi-runtime --test sqlite_public_api
      - name: Check SF04 HTML core, finalizer, and public runtime API on the target platform
        shell: bash
        run: |
          set -o pipefail
          if [[ ${ICU4X_DATA_DIR+x} ]]; then
            echo "ICU4X_DATA_DIR_PRESENT=true"
          else
            echo "ICU4X_DATA_DIR_PRESENT=false"
          fi
          unset ICU4X_DATA_DIR
          cargo test --locked -p nagi-runtime --lib html::tests:: 2>&1 | tee "$RUNNER_TEMP/sf04-html-core.log"
          cargo test --locked -p nagi-runtime --lib http_server::finalizer_ 2>&1 | tee "$RUNNER_TEMP/sf04-html-finalizer.log"
          cargo test --locked -p nagi-runtime --test html_core_api 2>&1 | tee "$RUNNER_TEMP/sf04-html-api.log"
          NAGI_TEST_ARTIFACT_DIR="$RUNNER_TEMP/sf04-native-artifacts" cargo test --locked -p nagic --test security_sf04 2>&1 | tee "$RUNNER_TEMP/sf04-native-contracts.log"
          python - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          expected = {
              "sf04-html-core.log": 20,
              "sf04-html-finalizer.log": 9,
              "sf04-html-api.log": 1,
              "sf04-native-contracts.log": 4,
          }
          for filename, count in expected.items():
              text = (root / filename).read_text(encoding="utf-8")
              pattern = rf"test result: ok\. {count} passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;"
              assert re.search(pattern, text), f"expected exactly {count} passing tests in {filename}; got:\n{text}"
          PY
      - name: Verify bilingual SQLite tutorial through High and independent saved Low
        run: python scripts/verify_sqlite_example.py
      - name: Verify High, saved Low, and standalone Low applications
        run: python scripts/verify_application_examples.py
      - name: Verify the PowerShell installer and User PATH
        if: matrix.platform == 'windows-x86_64'
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
        shell: pwsh
        run: ./scripts/releases/test_install.ps1 -Archive "build/distribution/nagi-$env:RELEASE_VERSION-windows-x86_64.zip" -Version $env:RELEASE_VERSION -TestUserPath
      - name: Verify Windows PowerShell 5.1 installation and upgrades
        if: matrix.platform == 'windows-x86_64'
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
        shell: powershell
        run: ./scripts/releases/test_install.ps1 -Archive "build/distribution/nagi-$env:RELEASE_VERSION-windows-x86_64.zip" -Version $env:RELEASE_VERSION -TestUserPath
      - name: Verify uninstallation with PowerShell 7
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./scripts/releases/test_uninstall.ps1
      - name: Verify uninstallation with Windows PowerShell 5.1
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        run: ./scripts/releases/test_uninstall.ps1
      - name: Verify the shell installer
        if: matrix.platform != 'windows-x86_64'
        run: python -m unittest discover -s scripts/releases -p 'test_install.py'
      - name: Verify the shell uninstaller
        if: matrix.platform != 'windows-x86_64'
        run: python -m unittest discover -s scripts/releases -p 'test_uninstall.py'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            build/distribution/nagi-*.zip
            build/distribution/nagi-*.tar.gz
            build/distribution/nagi-*.sha256
          if-no-files-found: error
      - name: Preserve target-platform HTTP receipt observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http413-observation-${{ matrix.platform }}
          path: build/compiler-failures/http413-nodelay-*.json
          if-no-files-found: ignore
      - name: Preserve target-platform compiler, application, and HTTP observation evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-failures-${{ matrix.platform }}
          path: build/compiler-failures/
          if-no-files-found: ignore

  ready:
    name: Ready to merge
    if: github.event_name == 'pull_request' && always()
    needs: [changes, linux, jetbrains, release-plan, vscode-package, nagi-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require checks and planned packages to succeed
        env:
          NAGI_CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci/gate.py

  publish-release:
    needs: [linux, release-plan, jetbrains, vscode-package, nagi-package]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (
        needs.linux.result == 'success' ||
        (needs.release-plan.outputs.release_jetbrains == 'true' &&
         needs.release-plan.outputs.release_nagi != 'true' &&
         needs.release-plan.outputs.release_vscode != 'true' &&
         needs.linux.result == 'skipped')
      ) && needs.release-plan.result == 'success' &&
      (needs.jetbrains.result == 'success' || needs.jetbrains.result == 'skipped') &&
      (needs.vscode-package.result == 'success' || needs.vscode-package.result == 'skipped') &&
      (needs.nagi-package.result == 'success' || needs.nagi-package.result == 'skipped') &&
      (needs.release-plan.outputs.release_jetbrains != 'true' || needs.jetbrains.result == 'success') &&
      (needs.release-plan.outputs.release_vscode != 'true' || needs.vscode-package.result == 'success') &&
      (needs.release-plan.outputs.release_nagi != 'true' || needs.nagi-package.result == 'success') &&
      (needs.release-plan.outputs.release_vscode == 'true' || needs.release-plan.outputs.release_nagi == 'true' || needs.release-plan.outputs.release_jetbrains == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release-assets
      - name: Publish VS Code extension
        if: needs.release-plan.outputs.release_vscode == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.vscode_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component vscode --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
      - name: Publish Nagi compiler and source
        if: needs.release-plan.outputs.release_nagi == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component nagi --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
      - name: Publish JetBrains plugin
        if: needs.release-plan.outputs.release_jetbrains == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.jetbrains_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component jetbrains --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
