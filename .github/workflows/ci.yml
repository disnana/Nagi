name: Nagi checks
on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Each main commit may release a different version; keep those runs separate.
  group: checks-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full_checks: ${{ steps.changes.outputs.full_checks }}
      jetbrains_checks: ${{ steps.changes.outputs.jetbrains_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check change detection and merge gating
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Compare the complete push or PR
        id: changes
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ github.sha }}
        run: python scripts/ci/changes.py --event "$CHECK_EVENT" --base "$CHECK_BASE" --head "$CHECK_HEAD" --output "$GITHUB_OUTPUT"

  jetbrains:
    needs: [changes, release-plan]
    if: >-
      always() && needs.changes.result == 'success' && needs.release-plan.result == 'success' &&
      (needs.changes.outputs.jetbrains_checks == 'true' || needs.release-plan.outputs.package_jetbrains == 'true')
    uses: ./.github/workflows/jetbrains.yml
    with:
      release_version: ${{ needs.release-plan.outputs.jetbrains_version }}

  linux:
    needs: changes
    if: needs.changes.outputs.full_checks == 'true'
    runs-on: ubuntu-latest
    env:
      NAGI_FAILURE_DIR: ${{ github.workspace }}/build/compiler-failures
      NAGI_GOLDEN_CAPTURE_DIR: ${{ github.workspace }}/build/compiler-failures/goldens
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: rustfmt, clippy
      - name: Cache Rust checks and sample builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Check SF06 signature diagnostic fake cases
        run: python -m unittest discover -s tests -p 'test_sf06_http_client_signature_diagnostic.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare BrowserLogin failure cases alone and with the parallel public suite
        shell: bash
        run: |
          set +e
          run_probe() {
            local profile="$1"
            local mode="$2"
            shift 2
            local -a pipeline_status
            CARGO_TERM_COLOR=never "$@" 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py "$mode"
            pipeline_status=("${PIPESTATUS[@]}")
            local cargo_exit="${pipeline_status[0]:-1}"
            local inventory_exit="${pipeline_status[1]:-1}"
            printf "browser_counter_probe profile=%s cargo_exit=%s inventory_exit=%s\n" "$profile" "$cargo_exit" "$inventory_exit"
            if [ "$cargo_exit" -ne 0 ] || [ "$inventory_exit" -ne 0 ]; then
              return 1
            fi
            return 0
          }
          if ! run_probe compile browser-counter-compile cargo test --locked -p nagi-runtime --test browser_login_public_api --no-run; then
            echo "browser_counter_probe stop=compile"
            exit 1
          fi
          if ! run_probe list browser-counter-list cargo test --locked -p nagi-runtime --test browser_login_public_api -- --list; then
            echo "browser_counter_probe stop=list"
            exit 1
          fi
          profile_failed=0
          if ! run_probe single-strict browser-counter-strict cargo test --locked -p nagi-runtime --test browser_login_public_api input_and_strict_json_rejections_do_not_consume_or_call_verifier -- --exact; then
            profile_failed=1
          fi
          if ! run_probe single-wire browser-counter-wire cargo test --locked -p nagi-runtime --test browser_login_public_api wire_body_cap_is_independent_of_db_quota_and_checked_before_claim -- --exact; then
            profile_failed=1
          fi
          if ! run_probe parallel-ten browser-counter-parallel cargo test --locked -p nagi-runtime --test browser_login_public_api; then
            profile_failed=1
          fi
          exit "$profile_failed"
      - name: Check call_member_ recovery first with exact result on the target platform
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nagic --test editor_assistance call_member_ -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/call-member-tests.log"
          python scripts/ci/assert_call_member_test_summary.py "$RUNNER_TEMP/call-member-tests.log"
      - name: Diagnose G3 generation-token failure before crypto checks
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p nagi-runtime --test session_csrf_public_api guarded_rotation_and_logout_invalidate_old_generation_tokens -- --exact 2>&1 | tee "$RUNNER_TEMP/g3-generation-target.log"
          python - <<'PY'
          import os, pathlib, re
          text = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "g3-generation-target.log").read_text(encoding="utf-8")
          summaries = re.findall(r"test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored;", text)
          if summaries != [("ok", "1", "0", "0")]:
              raise AssertionError(f"expected exactly one passing focused test (1 passed, 0 failed, 0 ignored), got {summaries}")
          PY
      - name: Check SF06 private native modules before broad runtime checks
        shell: bash
        run: |
          set -euo pipefail
          unset ICU4X_DATA_DIR
          cargo test --locked -p nagi-runtime --lib http_client::ledger:: 2>&1 | tee "$RUNNER_TEMP/sf06-private-ledger.log"
          cargo test --locked -p nagi-runtime --lib http_client::address:: 2>&1 | tee "$RUNNER_TEMP/sf06-private-transport.log"
          cargo test --locked -p nagi-runtime --lib auth::admission_bridge_tests:: 2>&1 | tee "$RUNNER_TEMP/sf06-private-admission.log"
          cargo test --locked -p nagi-runtime --lib auth::tests:: 2>&1 | tee "$RUNNER_TEMP/sf06-private-auth-core.log"
          cargo test --locked -p nagi-runtime --lib auth::credential_metadata_tests:: 2>&1 | tee "$RUNNER_TEMP/sf06-private-credential.log"
          cargo test --locked -p nagi-runtime --lib http_client::ledger::tracked_dns::tests:: 2>&1 | tee "$RUNNER_TEMP/sf06-private-dns-core.log"
          cargo test --locked -p nagi-runtime --lib http_client::ledger::tracked_dns::hickory::tests:: 2>&1 | tee "$RUNNER_TEMP/sf06-private-dns-hickory.log"
          cargo test --locked -p nagi-runtime --lib http_client::address::q1_dial::tests:: 2>&1 | tee "$RUNNER_TEMP/sf06-private-q1-pure.log"
          python - <<'PY_SUMMARY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          expected = {"sf06-private-ledger.log": 135, "sf06-private-transport.log": 82, "sf06-private-admission.log": 7, "sf06-private-auth-core.log": 9, "sf06-private-credential.log": 2, "sf06-private-dns-core.log": 30, "sf06-private-dns-hickory.log": 7, "sf06-private-q1-pure.log": 36}
          for name, count in expected.items():
              data = (root / name).read_text(encoding="utf-8")
              running = re.findall(r"(?m)^running (\d+) tests?$", data)
              results = re.findall(r"(?m)^test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured; \d+ filtered out; finished in .+$", data)
              if running != [str(count)] or results != [str(count)]:
                  raise AssertionError(f"{name}: expected exactly {count} real, passing tests")
          required_parent = {
              'http_client::ledger::admission::tests::auth_enqueue_winning_entry_retains_record_after_concurrent_stop',
              'http_client::ledger::admission::tests::branded_driver_history_rejects_second_driver_after_first_actual_join',
              'http_client::ledger::admission::tests::branded_phase_winner_finishes_once_then_stop_denies_next_entry',
              'http_client::ledger::admission::tests::branded_runner_rejects_foreign_same_id_at_every_port',
              'http_client::ledger::admission::tests::drop_posts_stop_without_owner_or_waiter_lock',
              'http_client::ledger::admission::tests::entry_guard_preserves_stop_after_a_winning_cas',
              'http_client::ledger::admission::tests::last_sender_drop_does_not_wait_for_watch_value_borrow',
              'http_client::ledger::admission::tests::old_key_cannot_authorize_reused_numeric_slot',
              'http_client::ledger::admission::tests::owner_destructor_posts_stop_without_waiting_for_waiter_gate',
              'http_client::ledger::admission::tests::parent_drop_posts_stop_and_pending_grant_cannot_enqueue',
              'http_client::ledger::admission::tests::repeated_stop_has_no_self_wake_while_pending_root_is_joined',
              'http_client::ledger::admission::tests::runner_handle_is_not_counted_and_last_sender_closes_eof',
              'http_client::ledger::admission::tests::stop_after_consumed_real_auth_permit_refuses_record_publication',
              'http_client::ledger::admission::tests::unwinding_entry_guard_closes_without_clearing_stop',
          }
          ledger_text = (root / "sf06-private-ledger.log").read_text(encoding="utf-8")
          passed_parent = set(re.findall(
              r"(?m)^test (http_client::ledger::admission::tests::[a-z0-9_]+) \.\.\. ok$",
              ledger_text,
          ))
          if not required_parent.issubset(passed_parent):
              raise AssertionError("SF06 branded parent test names missing or unsuccessful")
          required_added = {
              'http_client::ledger::admission::tests::abandon_popped_unstarted_retires_without_parent_stop',
              'http_client::ledger::admission::tests::abandon_drop_under_owner_waiter_watch_gates_is_prompt_and_reaped',
              'http_client::ledger::admission::tests::abandon_unwind_before_root_registration_retires',
              'http_client::ledger::admission::tests::abandon_cancel_keeps_popped_payload_until_drop',
              'http_client::ledger::admission::tests::borrowed_root_requires_command_and_keeps_join_distinct_from_payload_drop',
              'http_client::ledger::admission::tests::rejected_root_future_drops_outside_owner_and_command_remains_armed',
              'http_client::ledger::admission::tests::rejected_root_future_unwind_leaves_command_abandonment_reapable',
              'http_client::ledger::admission::tests::successful_root_completion_does_not_report_command_abandonment',
              'http_client::ledger::admission::tests::unexpected_root_abort_retains_sticky_fault_not_abandonment',
              'http_client::ledger::parent_drain::fallback_lost_wake_tests::fallback_lost_wake_after_monitor_abort',
              'http_client::ledger::parent_drain::fallback_lost_wake_tests::fallback_lost_wake_after_monitor_panic',
              'http_client::ledger::tracked_dns::tests::dns_brand_tests::dns_brand_foreign_same_numeric_id_must_not_construct',
              'http_client::ledger::tracked_dns::tests::dns_brand_tests::dns_brand_stale_phase_fail_must_not_poison_reused_id',
              'http_client::ledger::tracked_dns::tests::dns_brand_tests::dns_brand_native_poll_must_hold_busy_entry_through_stop',
              'http_client::ledger::tracked_dns::tests::dns_brand_extra_tests::dns_brand_unregistered_root_refuses_then_same_key_starts',
              'http_client::ledger::tracked_dns::tests::dns_brand_extra_tests::dns_brand_stop_before_entry_keeps_native_and_fault_zero',
              'http_client::ledger::tracked_dns::tests::dns_brand_extra_tests::dns_brand_entry_winner_registers_one_child_after_stop',
              'http_client::ledger::tracked_dns::tests::dns_brand_extra_tests::dns_brand_cancelled_root_keeps_ticket_until_receipt_and_join',
              'http_client::ledger::tracked_dns::tests::dns_brand_extra_tests::dns_brand_joined_root_refuses_start_but_same_key_receipt_drains',
              'http_client::ledger::tracked_dns::tests::dns_brand_extra_tests::dns_brand_deadline_after_entry_skips_native_primitive',
              'http_client::ledger::tracked_dns::tests::dns_brand_extra_tests::dns_brand_root_finishes_during_book_wait_skips_io',
          }
          required_delivery = {
              'http_client::ledger::admission::tests::sf06_closed_runtime_child_drop_is_outside_owner_and_entry',
              'http_client::ledger::admission::tests::sf06_closed_runtime_root_drop_is_outside_owner_and_entry',
              'http_client::ledger::parent_drain::fallback_lost_wake_tests::sf06_fallback_retains_external_child_and_wakes_after_cancelled_waiter',
              'http_client::ledger::parent_drain::fallback_lost_wake_tests::sf06_monitor_retains_external_child_paused_delivery',
              'http_client::ledger::parent_drain::fallback_lost_wake_tests::sf06_poisoned_owner_retains_external_child_until_delivery',
              'http_client::ledger::tests::sf06_delivery_drop_panic_does_not_acknowledge',
              'http_client::ledger::tests::sf06_delivery_register_recheck_and_independent_broadcast_wakes',
              'http_client::ledger::tests::sf06_failed_send_blocking_drop_retains_debt_and_cancelled_bare_drain',
              'http_client::ledger::tests::sf06_paused_delivery_retains_actual_handle_quota_and_join_bit',
              'http_client::ledger::tests::sf06_receipt_tracks_exact_reused_task_slot',
              'http_client::ledger::tests::sf06_stop_expiry_and_fault_cannot_join_before_delivery',
              'http_client::ledger::tracked_dns::tests::sf06_closed_runtime_dns_drop_is_outside_owner_book_and_entry',
              'http_client::ledger::tracked_dns::tests::sf06_multiple_dns_waiters_and_cancelled_waiter_wake_on_delivery',
              'http_client::ledger::tracked_dns::tests::sf06_paused_dns_delivery_retains_io_ticket_until_failed_send_drop',
          }
          passed_ledger = set(re.findall(
              r"(?m)^test (http_client::ledger::[a-z0-9_:]+) \.\.\. ok$", ledger_text,
          ))
          if not required_added.issubset(passed_ledger):
              raise AssertionError("SF06 new lifecycle/DNS test names missing or unsuccessful")
          if not required_delivery.issubset(passed_ledger):
              raise AssertionError("SF06 returned-handle delivery test names missing or unsuccessful")
          required_operation = {
              'http_client::ledger::operation::tests::adapter_panic_remains_fault_after_actual_root_join',
              'http_client::ledger::operation::tests::dropped_execute_retains_cleanup_until_actual_native_joins',
              'http_client::ledger::operation::tests::operation_withholds_real_https_response_until_actual_driver_join',
              'http_client::ledger::operation::tests::owner_close_refuses_publish_after_actual_native_joins',
              'http_client::ledger::operation::tests::unpolled_execute_starts_no_admission_or_native_resolution',
              'http_client::ledger::operation::tests::original_deadline_survives_provisional_response_and_join_wait',
              'http_client::ledger::operation::tests::unreceived_response_keeps_core_budget_after_actual_native_joins',
              'http_client::ledger::operation::tests::unsupported_encoding_is_unknown_and_never_replayed',
          }
          passed_operation = re.findall(
              r"(?m)^test (http_client::ledger::operation::tests::[a-z0-9_]+) \.\.\. ok$",
              ledger_text,
          )
          if set(passed_operation) != required_operation or len(passed_operation) != len(required_operation):
              raise AssertionError("SF06 operation test names missing, duplicated, or unsuccessful")
          required_h0 = {
              'http_client::ledger::admission::tests::sf06_h0_expired_driver_publication_autonomously_joins_existing_siblings',
              'http_client::ledger::admission::tests::sf06_h0_paused_driver_return_rejects_duplicate_without_registered_authority',
              'http_client::ledger::admission::tests::sf06_h0_paused_root_return_preserves_stage_through_stop_expiry_and_poison',
              'http_client::ledger::admission::tests::sf06_h0_pre_bind_unwind_retains_debt_and_original_payload',
              'http_client::ledger::parent_drain::fallback_lost_wake_tests::sf06_h0_inner_unwind_retains_debt_and_reaps_known_client_fault',
              'http_client::ledger::parent_drain::fallback_lost_wake_tests::sf06_h0_outer_unwind_cannot_retire_monitor_record_as_joined',
              'http_client::ledger::parent_drain::fallback_lost_wake_tests::sf06_h0_unresolved_outer_drains_known_inner_without_retiring',
              'http_client::ledger::tests::sf06_h0_launch_publication_wakes_independent_waiters_and_retains_receipt',
              'http_client::ledger::tracked_dns::tests::sf06_h0_paused_dns_root_retains_quota_without_io_authority',
          }
          passed_h0 = re.findall(
              r"(?m)^test ([a-z0-9_:]*::sf06_h0_[a-z0-9_]+) \.\.\. ok$",
              ledger_text,
          )
          if set(passed_h0) != required_h0 or len(passed_h0) != len(required_h0):
              raise AssertionError("SF06 H0 test names missing, duplicated, or unsuccessful")
          required_q1_native = {
              'http_client::address::socket_pin::q1_native::tests::q1_native_attempt_cap_prevents_second_connector_and_releases_first_slot',
              'http_client::address::socket_pin::q1_native::tests::q1_native_closed_plan_starts_no_connector',
              'http_client::address::socket_pin::q1_native::tests::q1_native_close_during_pending_connect_does_not_attempt_second_address',
              'http_client::address::socket_pin::q1_native::tests::q1_native_terminal_connect_failure_does_not_try_another_candidate',
              'http_client::address::socket_pin::q1_native::tests::q1_native_cancelled_caller_is_joined_before_reusing_socket_quota',
              'http_client::address::socket_pin::q1_native::tests::q1_native_ttl_zero_is_usable_for_one_owned_operation_without_cache',
              'http_client::address::socket_pin::q1_native::tests::q1_native_refused_first_address_connects_only_checked_second_peer',
              'http_client::address::socket_pin::q1_native::tests::q1_native_expired_original_connect_end_does_not_reset_budget',
          }
          transport_text = (root / "sf06-private-transport.log").read_text(encoding="utf-8")
          passed_q1_native = re.findall(
              r"(?m)^test (http_client::address::socket_pin::q1_native::tests::q1_native_[a-z0-9_]+) \.\.\. ok$",
              transport_text,
          )
          if set(passed_q1_native) != required_q1_native or len(passed_q1_native) != len(required_q1_native):
              raise AssertionError("SF06 Q1 native test names missing, duplicated, unexpected, or unsuccessful")
          PY_SUMMARY
      - name: Check SF02 Ed25519 fixed-profile runtime and trusted adapter
        shell: bash
        run: |
          set -euo pipefail
          unset ICU4X_DATA_DIR
          cargo test --locked -p nagi-runtime --lib auth::ed25519:: 2>&1 | tee "$RUNNER_TEMP/sf02-ed25519-core.log"
          cargo test --locked -p nagi-runtime --test ed25519_public_api 2>&1 | tee "$RUNNER_TEMP/sf02-ed25519-public.log"
          python - <<'PY'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          for name, count in {"sf02-ed25519-core.log": 14, "sf02-ed25519-public.log": 1}.items():
              text = (root / name).read_text(encoding="utf-8")
              if not re.search(rf"test result: ok\. {count} passed; 0 failed; 0 ignored;", text):
                  raise AssertionError(f"{name}: expected {count} passed, 0 failed, 0 ignored")
          PY
      - name: Check SF07 charged native wire checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/tests/test_sf07_wire_source.py
          python -B scripts/tests/test_sf07_transport_source.py
          python -B scripts/tests/test_sf07_request_source.py
          python -B scripts/tests/test_sf07_rate_source.py
          python -B scripts/tests/test_sf07_checkpoint_summary.py
          if [ "$RUNNER_OS" = "Windows" ]; then
            NAGI_TEST_BASH="$(cygpath -w "$BASH")"
          else
            NAGI_TEST_BASH="$BASH"
          fi
          export NAGI_TEST_BASH
          python -B scripts/tests/test_sf07_owned_state_summary.py
          cargo test --locked -p nagi-runtime --lib http_server::response_budget:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py wire
          cargo test --locked -p nagi-runtime --lib security_sf07_private::quota::tests:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py quota
          cargo test --locked -p nagi-runtime --lib http_server::response_send::tests:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py transport
          cargo test --locked -p nagi-runtime --lib http_server::request_headers::tests:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py request
          cargo test --locked -p nagi-runtime --lib security_sf07_private::startup_rate::tests:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py rate-startup
          cargo test --locked -p nagi-runtime --lib security_sf07_private::quota::retained_catalog_tests:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py catalog-retained
          cargo test --locked -p nagi-runtime --lib auth::csrf::fixed_body::tests:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py fixed-owner
          cargo test --locked -p nagi-runtime --lib auth::csrf::tests::fixed_wire_owner_tests:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py csrf-issuer
          cargo test --locked -p nagi-runtime --lib auth::prelogin::tests::fixed_wire_owner_tests:: 2>&1 | python -B scripts/ci/sf07_checkpoint_summary.py prelogin-issuer
          CARGO_TERM_COLOR=never cargo test --locked -p nagi-runtime --lib security_sf07_private::owned_state_lock::tests:: 2>&1 | python -B scripts/ci/sf07_owned_state_summary.py lock
          CARGO_TERM_COLOR=never cargo test --locked -p nagi-runtime --lib security_sf07_private::owned_state_owner_tests:: 2>&1 | python -B scripts/ci/sf07_owned_state_summary.py owners
          CARGO_TERM_COLOR=never cargo test --locked -p nagi-runtime --lib http_server::response_send::owned_state_lock_tests:: 2>&1 | python -B scripts/ci/sf07_owned_state_summary.py send
      - name: Check SF02 public Session runtime and one-use delivery before other checks
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os; print("ICU4X_DATA_DIR present:", "ICU4X_DATA_DIR" in os.environ)'
          unset ICU4X_DATA_DIR
          cargo check --locked -p nagi-runtime --lib
          cargo test --locked -p nagi-runtime --lib auth::session::http_bridge::delivery_tests:: 2>&1 | tee "$RUNNER_TEMP/sf02-delivery-wire.log"
          cargo test --locked -p nagi-runtime --lib auth::session::delivery::wire_tests:: 2>&1 | tee "$RUNNER_TEMP/sf02-delivery-cell.log"
          cargo test --locked -p nagi-runtime --lib auth::session::delivery::tests:: 2>&1 | tee "$RUNNER_TEMP/sf02-delivery-core.log"
          cargo test --locked -p nagi-runtime --lib auth::session::http_bridge::tests:: 2>&1 | tee "$RUNNER_TEMP/sf02-http-bridge.log"
          cargo test --locked -p nagi-runtime --test session_public_api 2>&1 | tee "$RUNNER_TEMP/sf02-public-api.log"
          cargo test --locked -p nagi-runtime --lib http_server::tests::unsafe_session_tests:: 2>&1 | tee "$RUNNER_TEMP/sf02-unsafe-session.log"
          cargo test --locked -p nagi-runtime --lib auth::session::tests:: 2>&1 | tee "$RUNNER_TEMP/sf02-persistent-store.log"
