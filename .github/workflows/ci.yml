name: Nagi checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  # Each main commit may release a different version; keep those runs separate.
  group: checks-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full_checks: ${{ steps.changes.outputs.full_checks }}
      jetbrains_checks: ${{ steps.changes.outputs.jetbrains_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check change detection and merge gating
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Compare the complete push or PR
        id: changes
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ github.sha }}
        run: python scripts/ci/changes.py --event "$CHECK_EVENT" --base "$CHECK_BASE" --head "$CHECK_HEAD" --output "$GITHUB_OUTPUT"

  jetbrains:
    needs: changes
    # main pushes use the dedicated workflow; PRs share the merge gate below.
    if: github.event_name != 'push' && needs.changes.outputs.jetbrains_checks == 'true'
    uses: ./.github/workflows/jetbrains.yml

  linux:
    needs: changes
    if: needs.changes.outputs.full_checks == 'true'
    runs-on: ubuntu-latest
    env:
      NAGI_FAILURE_DIR: ${{ github.workspace }}/build/compiler-failures
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: rustfmt, clippy
      - name: Cache Rust checks and sample builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Check conformance corpus and regression harness registration
        run: python scripts/verify_compiler_contracts.py
      - run: cargo test --locked
      - name: Check a compiler without the SQL validation engine
        run: |
          cargo build --locked -p nagic --no-default-features
          cargo test --locked -p nagic --no-default-features --test cli --test sql_check
      - run: cargo build --release --examples --bins --locked
      - run: node --test editors/vscode-nagi/test/*.test.js
      - run: node --test scripts/test_graph_html_viewport.mjs
      - run: python -m unittest discover -s scripts/releases -p 'test_*.py'
      - run: python -m unittest discover -s scripts -p 'test_native_artifacts.py'
      - run: python scripts/build_examples.py
      - run: pip install -r tests/requirements.txt
      - run: python tests/http_integration.py
      - run: python tests/route_integration.py
      - run: python tests/http_stdlib_integration.py
      - run: ./target/release/examples/fuzz-smoke
      - name: Preserve compiler failure reproductions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-failures-linux
          path: build/compiler-failures/
          if-no-files-found: ignore

  release-plan:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      nagi_version: ${{ steps.plan.outputs.nagi_version }}
      vscode_version: ${{ steps.plan.outputs.vscode_version }}
      release_nagi: ${{ steps.plan.outputs.release_nagi }}
      release_vscode: ${{ steps.plan.outputs.release_vscode }}
      package_nagi: ${{ steps.plan.outputs.package_nagi }}
      package_vscode: ${{ steps.plan.outputs.package_vscode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare versions across the complete push or PR
        id: plan
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD: ${{ github.sha }}
        run: python scripts/releases/plan.py --base "$RELEASE_BASE" --head "$RELEASE_HEAD" --output "$GITHUB_OUTPUT"

  vscode-package:
    needs: release-plan
    if: needs.release-plan.outputs.package_vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python editors/vscode-nagi/scripts/package_vsix.py
      - name: Verify and checksum the VSIX
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.vscode_version }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from xml.etree import ElementTree
          from zipfile import ZipFile
          path = Path('build/distribution') / f'nagi-language-{os.environ["RELEASE_VERSION"]}.vsix'
          with ZipFile(path) as archive:
              assert archive.testzip() is None
              package = json.loads(archive.read('extension/package.json'))
              identity = ElementTree.fromstring(archive.read('extension.vsixmanifest')).find('{*}Metadata/{*}Identity').attrib
              assert package['version'] == identity['Version'] == os.environ['RELEASE_VERSION']
              assert package['publisher'] == identity['Publisher']
              assert package['name'] == identity['Id']
          path.with_name(path.name + '.sha256').write_text(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-vscode
          path: |
            build/distribution/*.vsix
            build/distribution/*.vsix.sha256
          if-no-files-found: error

  nagi-package:
    needs: release-plan
    if: needs.release-plan.outputs.package_nagi == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            executable: nagic
            rust_host: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            executable: nagic.exe
            rust_host: x86_64-pc-windows-msvc
          - os: macos-15
            platform: macos-arm64
            executable: nagic
            rust_host: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x86_64
            executable: nagic
            rust_host: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      NAGI_FAILURE_DIR: ${{ github.workspace }}/build/compiler-failures
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Cache the target platform's Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the compiler host architecture
        env:
          RELEASE_RUST_HOST: ${{ matrix.rust_host }}
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          lines = subprocess.check_output(['rustc', '-vV'], text=True).splitlines()
          host = next(line.removeprefix('host: ') for line in lines if line.startswith('host: '))
          assert host == os.environ['RELEASE_RUST_HOST'], host
          PY
      - name: Fetch locked runtime dependencies before offline tests
        env:
          RELEASE_RUST_HOST: ${{ matrix.rust_host }}
        shell: bash
        run: cargo fetch --locked --target "$RELEASE_RUST_HOST"
      - run: cargo build --release --locked -p nagic
      - name: Check CLI, installation, ownership, and diagnostics on the target platform
        run: cargo test --locked -p nagic --lib --test cli --test installation --test codegen --test loop_ownership --test ownership_calls --test ownership_boundaries --test comparison_ownership --test owned_copy_codegen --test build_diagnostics --test rust_dependencies --test expression_contracts --test frontend_contracts --test literal_contracts --test http_route_conflicts --test symbols --test modules --test module_parser --test module_emission --test module_symbols --test enum_parser --test enum_modules --test enum_emission --test enum_patterns --test nullable_database --test nullable_roundtrip --test owned_database --test borrow_free_returns --test static_callback_views --test view_iteration --test view_parameter_rebinding --test sql_check --test typed_errors --test error_routes --test class_field_types --test stdlib_imports --test option_match --test http_stdlib --test http_codegen --test actor_stdlib --test actor_codegen --test graph_types --test graph_relations --test graph_render --test graph_html --test map_cli --test low_multiline --test list_ownership_inference --test list_borrow_iteration --test result_stdlib
      - name: Check editor behavior on the target platform
        shell: bash
        run: node --test editors/vscode-nagi/test/*.test.js scripts/test_graph_html_viewport.mjs
      - name: Check generated output protection and native expression behavior
        run: cargo test --locked -p nagic --test output_safety --test integer_arithmetic --test integer_zero_division --test constant_validation --test auth_boundaries --test view_branch_rebinding --test view_container_rebinding --test view_container_drop --test view_flow_foundation --test view_flow_completion --test conformance --test scope_runtime_contract --test copy_capabilities --test asset_calls --test shared_target --test build_generations --test project
      - name: Check successful application artifact selection
        run: python -m unittest discover -s scripts -p 'test_native_artifacts.py'
      - name: Check oversized HTTP bodies and connection recovery on the target platform
        run: cargo test --locked -p nagi-runtime oversized_body_ -- --test-threads=1
      - name: Check HTTP panic recovery on the target platform
        run: cargo test --locked -p nagi-runtime panic_ -- --test-threads=1
      - name: Check HTTP handler deadlines on the target platform
        run: cargo test --locked -p nagi-runtime handler_timeout_ -- --test-threads=1
      - name: Check demo packaging with Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/build_windows_demo.ps1 -Source examples/hello.nagi -Offline
          $output = & ./build/distribution/nagi-hello.exe
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'Hello, Nagi!') { throw 'Packaged Hello failed.' }
      - name: Check demo packaging with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build_windows_demo.ps1 -Source examples/hello.nagi -Offline
          $output = & ./build/distribution/nagi-hello.exe
          if ($LASTEXITCODE -ne 0 -or $output -notcontains 'Hello, Nagi!') { throw 'Packaged Hello failed.' }
          ./test-nagi-code/build_fractal_exe.ps1 -Offline
          $output = 'q' | & ./build/distribution/nagi-fractal.exe
          if ($LASTEXITCODE -ne 0 -or -not ($output -match 'Goodbye!')) { throw 'Packaged fractal failed.' }
      - name: Package tracked source and the compiler
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
        shell: bash
        run: python scripts/releases/package.py --binary "target/release/$RELEASE_EXECUTABLE" --version "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM"
      - name: Verify an extracted distribution outside the checkout
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/releases')
          from verify import verify
          version, platform = os.environ['RELEASE_VERSION'], os.environ['RELEASE_PLATFORM']
          suffix = '.zip' if os.name == 'nt' else '.tar.gz'
          verify(Path('build/distribution') / f'nagi-{version}-{platform}{suffix}', version, platform, Path('native-target'))
          PY
      - name: Check HTTP route parameters on the target platform
        run: python tests/route_integration.py
      - name: Check standard HTTP High and saved Low on the target platform
        run: python tests/http_stdlib_integration.py
      - name: Check scoped task captures on the target platform
        run: cargo test --locked -p nagic --test scoped_tasks
      - name: Check actor lifecycle and supervisor cancellation on the target platform
        run: |
          cargo test --locked -p nagi-runtime actor::
          cargo test --locked -p nagi-runtime supervisor_drop
      - name: Check SQLite row counts on the target platform
        run: cargo test --locked -p nagi-runtime database::tests
      - name: Verify High, saved Low, and standalone Low applications
        run: python scripts/verify_application_examples.py
      - name: Verify the PowerShell installer and User PATH
        if: matrix.platform == 'windows-x86_64'
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
        shell: pwsh
        run: ./scripts/releases/test_install.ps1 -Archive "build/distribution/nagi-$env:RELEASE_VERSION-windows-x86_64.zip" -Version $env:RELEASE_VERSION -TestUserPath
      - name: Verify Windows PowerShell 5.1 installation and upgrades
        if: matrix.platform == 'windows-x86_64'
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
        shell: powershell
        run: ./scripts/releases/test_install.ps1 -Archive "build/distribution/nagi-$env:RELEASE_VERSION-windows-x86_64.zip" -Version $env:RELEASE_VERSION -TestUserPath
      - name: Verify uninstallation with PowerShell 7
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./scripts/releases/test_uninstall.ps1
      - name: Verify uninstallation with Windows PowerShell 5.1
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        run: ./scripts/releases/test_uninstall.ps1
      - name: Verify the shell installer
        if: matrix.platform != 'windows-x86_64'
        run: python -m unittest discover -s scripts/releases -p 'test_install.py'
      - name: Verify the shell uninstaller
        if: matrix.platform != 'windows-x86_64'
        run: python -m unittest discover -s scripts/releases -p 'test_uninstall.py'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            build/distribution/nagi-*.zip
            build/distribution/nagi-*.tar.gz
            build/distribution/nagi-*.sha256
          if-no-files-found: error
      - name: Preserve target-platform compiler failure reproductions
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-failures-${{ matrix.platform }}
          path: build/compiler-failures/
          if-no-files-found: ignore

  ready:
    name: Ready to merge
    if: github.event_name == 'pull_request' && always()
    needs: [changes, linux, jetbrains, release-plan, vscode-package, nagi-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require checks and planned packages to succeed
        env:
          NAGI_CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci/gate.py

  publish-release:
    needs: [linux, release-plan, vscode-package, nagi-package]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.linux.result == 'success' && needs.release-plan.result == 'success' &&
      (needs.vscode-package.result == 'success' || needs.vscode-package.result == 'skipped') &&
      (needs.nagi-package.result == 'success' || needs.nagi-package.result == 'skipped') &&
      (needs.release-plan.outputs.release_vscode != 'true' || needs.vscode-package.result == 'success') &&
      (needs.release-plan.outputs.release_nagi != 'true' || needs.nagi-package.result == 'success') &&
      (needs.release-plan.outputs.release_vscode == 'true' || needs.release-plan.outputs.release_nagi == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release-assets
      - name: Publish VS Code extension
        if: needs.release-plan.outputs.release_vscode == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.vscode_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component vscode --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
      - name: Publish Nagi compiler and source
        if: needs.release-plan.outputs.release_nagi == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component nagi --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
