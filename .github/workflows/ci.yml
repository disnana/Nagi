name: Nagi checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  # Each main commit may release a different version; keep those runs separate.
  group: checks-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full_checks: ${{ steps.changes.outputs.full_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check change detection and merge gating
        run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Compare the complete push or PR
        id: changes
        env:
          CHECK_EVENT: ${{ github.event_name }}
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHECK_HEAD: ${{ github.sha }}
        run: python scripts/ci/changes.py --event "$CHECK_EVENT" --base "$CHECK_BASE" --head "$CHECK_HEAD" --output "$GITHUB_OUTPUT"

  linux:
    needs: changes
    if: needs.changes.outputs.full_checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          components: rustfmt, clippy
      - name: Cache Rust checks and sample builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            nagi-rust-v1-checks-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --examples --bins --locked
      - run: node --test editors/vscode-nagi/test/*.test.js
      - run: node --test scripts/test_graph_html_viewport.mjs
      - run: python -m unittest discover -s scripts/releases -p 'test_*.py'
      - run: python scripts/build_examples.py
      - run: pip install -r tests/requirements.txt
      - run: python tests/http_integration.py
      - run: python tests/route_integration.py
      - run: python tests/http_stdlib_integration.py
      - run: ./target/release/examples/fuzz-smoke

  release-plan:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      nagi_version: ${{ steps.plan.outputs.nagi_version }}
      vscode_version: ${{ steps.plan.outputs.vscode_version }}
      release_nagi: ${{ steps.plan.outputs.release_nagi }}
      release_vscode: ${{ steps.plan.outputs.release_vscode }}
      package_nagi: ${{ steps.plan.outputs.package_nagi }}
      package_vscode: ${{ steps.plan.outputs.package_vscode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare versions across the complete push or PR
        id: plan
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD: ${{ github.sha }}
        run: python scripts/releases/plan.py --base "$RELEASE_BASE" --head "$RELEASE_HEAD" --output "$GITHUB_OUTPUT"

  vscode-package:
    needs: release-plan
    if: needs.release-plan.outputs.package_vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python editors/vscode-nagi/scripts/package_vsix.py
      - name: Verify and checksum the VSIX
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.vscode_version }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from xml.etree import ElementTree
          from zipfile import ZipFile
          path = Path('build/distribution') / f'nagi-language-{os.environ["RELEASE_VERSION"]}.vsix'
          with ZipFile(path) as archive:
              assert archive.testzip() is None
              package = json.loads(archive.read('extension/package.json'))
              identity = ElementTree.fromstring(archive.read('extension.vsixmanifest')).find('{*}Metadata/{*}Identity').attrib
              assert package['version'] == identity['Version'] == os.environ['RELEASE_VERSION']
              assert package['publisher'] == identity['Publisher']
              assert package['name'] == identity['Id']
          path.with_name(path.name + '.sha256').write_text(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-vscode
          path: |
            build/distribution/*.vsix
            build/distribution/*.vsix.sha256
          if-no-files-found: error

  nagi-package:
    needs: release-plan
    if: needs.release-plan.outputs.package_nagi == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            executable: nagic
            rust_host: x86_64-unknown-linux-gnu
          - os: windows-latest
            platform: windows-x86_64
            executable: nagic.exe
            rust_host: x86_64-pc-windows-msvc
          - os: macos-15
            platform: macos-arm64
            executable: nagic
            rust_host: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos-x86_64
            executable: nagic
            rust_host: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - name: Cache the target platform's Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            native-target
          key: nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'compiler/**', 'runtime/**') }}
          restore-keys: |
            nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
            nagi-rust-v1-package-${{ matrix.platform }}-${{ steps.rust.outputs.cachekey }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the compiler host architecture
        env:
          RELEASE_RUST_HOST: ${{ matrix.rust_host }}
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess
          lines = subprocess.check_output(['rustc', '-vV'], text=True).splitlines()
          host = next(line.removeprefix('host: ') for line in lines if line.startswith('host: '))
          assert host == os.environ['RELEASE_RUST_HOST'], host
          PY
      - name: Fetch locked runtime dependencies before offline tests
        env:
          RELEASE_RUST_HOST: ${{ matrix.rust_host }}
        shell: bash
        run: cargo fetch --locked --target "$RELEASE_RUST_HOST"
      - run: cargo build --release --locked -p nagic
      - name: Check CLI, installation, ownership, and diagnostics on the target platform
        run: cargo test --locked -p nagic --test cli --test installation --test codegen --test loop_ownership --test ownership_calls --test ownership_boundaries --test comparison_ownership --test owned_copy_codegen --test build_diagnostics --test rust_dependencies --test expression_contracts --test frontend_contracts --test literal_contracts --test http_route_conflicts --test symbols --test modules --test module_parser --test module_emission --test module_symbols --test enum_parser --test enum_modules --test enum_emission --test enum_patterns --test nullable_database --test nullable_roundtrip --test typed_errors --test error_routes --test class_field_types --test stdlib_imports --test option_match --test http_stdlib --test http_codegen --test actor_stdlib --test actor_codegen --test graph_types --test graph_relations --test graph_render --test graph_html --test map_cli
      - name: Check editor behavior on the target platform
        shell: bash
        run: node --test editors/vscode-nagi/test/*.test.js scripts/test_graph_html_viewport.mjs
      - name: Check generated output protection and native expression behavior
        run: cargo test --locked -p nagic --test output_safety --test integer_arithmetic --test copy_capabilities --test asset_calls
      - name: Package tracked source and the compiler
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
        shell: bash
        run: python scripts/releases/package.py --binary "target/release/$RELEASE_EXECUTABLE" --version "$RELEASE_VERSION" --platform "$RELEASE_PLATFORM"
      - name: Verify an extracted distribution outside the checkout
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/releases')
          from verify import verify
          version, platform = os.environ['RELEASE_VERSION'], os.environ['RELEASE_PLATFORM']
          suffix = '.zip' if os.name == 'nt' else '.tar.gz'
          verify(Path('build/distribution') / f'nagi-{version}-{platform}{suffix}', version, platform, Path('native-target'))
          PY
      - name: Check HTTP route parameters on the target platform
        run: python tests/route_integration.py
      - name: Check scoped task captures on the target platform
        run: cargo test --locked -p nagic --test scoped_tasks
      - name: Check actor lifecycle and supervisor cancellation on the target platform
        run: |
          cargo test --locked -p nagi-runtime actor::
          cargo test --locked -p nagi-runtime supervisor_drop
      - name: Check SQLite row counts on the target platform
        run: cargo test --locked -p nagi-runtime database::tests
      - name: Verify applications from High and saved Low on the target platform
        run: python scripts/verify_application_examples.py
      - name: Verify the PowerShell installer and User PATH
        if: matrix.platform == 'windows-x86_64'
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
        shell: pwsh
        run: ./scripts/releases/test_install.ps1 -Archive "build/distribution/nagi-$env:RELEASE_VERSION-windows-x86_64.zip" -Version $env:RELEASE_VERSION -TestUserPath
      - name: Verify Windows PowerShell 5.1 installation and upgrades
        if: matrix.platform == 'windows-x86_64'
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
        shell: powershell
        run: ./scripts/releases/test_install.ps1 -Archive "build/distribution/nagi-$env:RELEASE_VERSION-windows-x86_64.zip" -Version $env:RELEASE_VERSION -TestUserPath
      - name: Verify the shell installer
        if: matrix.platform != 'windows-x86_64'
        run: python -m unittest discover -s scripts/releases -p 'test_install.py'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            build/distribution/nagi-*.zip
            build/distribution/nagi-*.tar.gz
            build/distribution/nagi-*.sha256
          if-no-files-found: error

  ready:
    name: Ready to merge
    if: github.event_name == 'pull_request' && always()
    needs: [changes, linux, release-plan, vscode-package, nagi-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require checks and planned packages to succeed
        env:
          NAGI_CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci/gate.py

  publish-release:
    needs: [linux, release-plan, vscode-package, nagi-package]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.linux.result == 'success' && needs.release-plan.result == 'success' &&
      (needs.vscode-package.result == 'success' || needs.vscode-package.result == 'skipped') &&
      (needs.nagi-package.result == 'success' || needs.nagi-package.result == 'skipped') &&
      (needs.release-plan.outputs.release_vscode == 'true' || needs.release-plan.outputs.release_nagi == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release-assets
      - name: Publish VS Code extension
        if: needs.release-plan.outputs.release_vscode == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.vscode_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component vscode --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
      - name: Publish Nagi compiler and source
        if: needs.release-plan.outputs.release_nagi == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component nagi --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
