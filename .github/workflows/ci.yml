          set -o pipefail
          if [[ ${ICU4X_DATA_DIR+x} ]]; then
            echo "ICU4X_DATA_DIR_PRESENT=true"
          else
            echo "ICU4X_DATA_DIR_PRESENT=false"
          fi
          unset ICU4X_DATA_DIR
          cargo test --locked -p nagi-runtime --lib html::tests:: 2>&1 | tee "$RUNNER_TEMP/sf04-html-core.log"
          cargo test --locked -p nagi-runtime --lib http_server::finalizer_ 2>&1 | tee "$RUNNER_TEMP/sf04-html-finalizer.log"
          cargo test --locked -p nagi-runtime --test html_core_api 2>&1 | tee "$RUNNER_TEMP/sf04-html-api.log"
          NAGI_TEST_ARTIFACT_DIR="$RUNNER_TEMP/sf04-native-artifacts" cargo test --locked -p nagic --test security_sf04 2>&1 | tee "$RUNNER_TEMP/sf04-native-contracts.log"
          python - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          expected = {
              "sf04-html-core.log": 20,
              "sf04-html-finalizer.log": 9,
              "sf04-html-api.log": 1,
              "sf04-native-contracts.log": 4,
          }
          for filename, count in expected.items():
              text = (root / filename).read_text(encoding="utf-8")
              pattern = rf"test result: ok\. {count} passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;"
              assert re.search(pattern, text), f"expected exactly {count} passing tests in {filename}; got:\n{text}"
          PY
      - name: Verify bilingual SQLite tutorial through High and independent saved Low
        run: python scripts/verify_sqlite_example.py
      - name: Verify High, saved Low, and standalone Low applications
        run: python scripts/verify_application_examples.py
      - name: Verify the PowerShell installer and User PATH
        if: matrix.platform == 'windows-x86_64'
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
        shell: pwsh
        run: ./scripts/releases/test_install.ps1 -Archive "build/distribution/nagi-$env:RELEASE_VERSION-windows-x86_64.zip" -Version $env:RELEASE_VERSION -TestUserPath
      - name: Verify Windows PowerShell 5.1 installation and upgrades
        if: matrix.platform == 'windows-x86_64'
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
        shell: powershell
        run: ./scripts/releases/test_install.ps1 -Archive "build/distribution/nagi-$env:RELEASE_VERSION-windows-x86_64.zip" -Version $env:RELEASE_VERSION -TestUserPath
      - name: Verify uninstallation with PowerShell 7
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: ./scripts/releases/test_uninstall.ps1
      - name: Verify uninstallation with Windows PowerShell 5.1
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        run: ./scripts/releases/test_uninstall.ps1
      - name: Verify the shell installer
        if: matrix.platform != 'windows-x86_64'
        run: python -m unittest discover -s scripts/releases -p 'test_install.py'
      - name: Verify the shell uninstaller
        if: matrix.platform != 'windows-x86_64'
        run: python -m unittest discover -s scripts/releases -p 'test_uninstall.py'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            build/distribution/nagi-*.zip
            build/distribution/nagi-*.tar.gz
            build/distribution/nagi-*.sha256
          if-no-files-found: error
      - name: Preserve target-platform HTTP receipt observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http413-observation-${{ matrix.platform }}
          path: build/compiler-failures/http413-nodelay-*.json
          if-no-files-found: ignore
      - name: Enforce Session auth-stage supplement after normal checks
        if: always() && steps.auth_stage_diag.outcome != 'skipped'
        shell: bash
        run: test '${{ steps.auth_stage_diag.outcome }}' = success
      - name: Enforce Session deadline diagnostic after normal checks
        if: always() && steps.session_deadline_diag.outcome != 'skipped'
        shell: bash
        run: test '${{ steps.session_deadline_diag.outcome }}' = success
      - name: Measure bounded SF07 response and rate profile
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/tests/test_sf07_profile_summary.py
          cargo test --locked -p nagi-runtime --test sf07_small_profile --no-run
          cargo test --locked -p nagi-runtime --test sf07_small_profile -- --list > "$RUNNER_TEMP/sf07-profile-list.log"
          python - <<'PYSF07LIST'
          import os,pathlib,re
          text=(pathlib.Path(os.environ["RUNNER_TEMP"])/"sf07-profile-list.log").read_text()
          if re.findall(r"(?m)^([a-z0-9_]+): test$",text) != ["response_profile_reports_closed_measurements"]:
              raise SystemExit("sf07_profile_inventory=invalid")
          PYSF07LIST
          set +e
          cargo test --locked -p nagi-runtime --test sf07_small_profile response_profile_reports_closed_measurements -- --exact --show-output > "$RUNNER_TEMP/sf07-profile-native.log" 2>&1
          profile_rc=$?
          set -e
          python -B scripts/ci/sf07_profile_summary.py --cargo-exit-code "$profile_rc" < "$RUNNER_TEMP/sf07-profile-native.log"
      - name: Preserve target-platform compiler, application, and HTTP observation evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-failures-${{ matrix.platform }}
          path: build/compiler-failures/
          if-no-files-found: ignore

  ready:
    name: Ready to merge
    if: github.event_name == 'pull_request' && always()
    needs: [changes, linux, rust-1-88, jetbrains, release-plan, vscode-package, nagi-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require checks and planned packages to succeed
        env:
          NAGI_CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci/gate.py

  publish-release:
    needs: [linux, rust-1-88, release-plan, jetbrains, vscode-package, nagi-package]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (
        (needs.linux.result == 'success' && needs.rust-1-88.result == 'success') ||
        (needs.release-plan.outputs.release_jetbrains == 'true' &&
         needs.release-plan.outputs.release_nagi != 'true' &&
         needs.release-plan.outputs.release_vscode != 'true' &&
         needs.linux.result == 'skipped' &&
         needs.rust-1-88.result == 'skipped')
      ) && needs.release-plan.result == 'success' &&
      (needs.jetbrains.result == 'success' || needs.jetbrains.result == 'skipped') &&
      (needs.vscode-package.result == 'success' || needs.vscode-package.result == 'skipped') &&
      (needs.nagi-package.result == 'success' || needs.nagi-package.result == 'skipped') &&
      (needs.release-plan.outputs.release_jetbrains != 'true' || needs.jetbrains.result == 'success') &&
      (needs.release-plan.outputs.release_vscode != 'true' || needs.vscode-package.result == 'success') &&
      (needs.release-plan.outputs.release_nagi != 'true' || needs.nagi-package.result == 'success') &&
      (needs.release-plan.outputs.release_vscode == 'true' || needs.release-plan.outputs.release_nagi == 'true' || needs.release-plan.outputs.release_jetbrains == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: build/release-assets
      - name: Publish VS Code extension
        if: needs.release-plan.outputs.release_vscode == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.vscode_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component vscode --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
      - name: Publish Nagi compiler and source
        if: needs.release-plan.outputs.release_nagi == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.nagi_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component nagi --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
      - name: Publish JetBrains plugin
        if: needs.release-plan.outputs.release_jetbrains == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.jetbrains_version }}
          RELEASE_SHA: ${{ needs.release-plan.outputs.sha }}
        run: python scripts/releases/publish.py --repository "$GITHUB_REPOSITORY" --component jetbrains --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --assets build/release-assets
