name: SF07 exact-source Session failure observation
'on':
  push:
    branches:
    - test/sf07-session-observe-20261018
permissions:
  contents: read
jobs:
  session-observation:
    if: github.ref == 'refs/heads/test/sf07-session-observe-20261018'
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: never
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 2
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Verify exact parent, frozen source and closed guard controls
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD^)" = "778c9cd1ce3ebd50b4e1e0f592043602f5031e25"
        test -z "${RUST_TEST_THREADS+x}"
        cat > "$RUNNER_TEMP/sf07-selected-guard.py" <<'PY'
