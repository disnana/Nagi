        def source_bytes(raw, size, lines, digest):
            if len(raw) > size + lines:
                raise ValueError('source size mismatch')
            normalized = raw.replace(b'\r\n', b'\n')
            if b'\r' in normalized:
                raise ValueError('bare source carriage return')
            normalized.decode('utf-8', errors='strict')
            if len(normalized) != size or hashlib.sha256(normalized).hexdigest() != digest:
                raise ValueError('frozen source mismatch')


        def sources():
            for name, (digest, size, lines) in SOURCES.items():
                path = Path(name)
                if path.is_symlink() or not path.is_file():
                    raise ValueError('source must be a regular file')
                with path.open('rb') as handle:
                    raw = handle.read(size + lines + 1)
                source_bytes(raw, size, lines, digest)
            print('frozen_sources=36 verified; LF_or_CRLF_only')


        def list_names(text):
            names, footers = [], []
            for line in text.splitlines():
                if not line:
                    continue
                entry = re.fullmatch(r'(\S+): test', line)
                if entry:
                    names.append(entry[1])
                    continue
                footer = re.fullmatch(r'(\d+) tests?, (\d+) benchmarks?', line)
                if not footer:
                    raise ValueError('unknown collection shape')
                footers.append((int(footer[1]), int(footer[2])))
            if len(names) != len(set(names)) or footers != [(len(names), 0)]:
                raise ValueError('invalid collection count')
            return set(names)


        def exact_listing(text, expected):
            names = list_names(text)
            if len(expected) != 1 or names != set(expected):
                raise ValueError('exact one-case collection mismatch')


        def listing(lib, external):
            library, integration = list_names(lib), list_names(external)
            prefixes = {
                'browser_stage': 'http_server::browser_login::stage_tests::',
                'new_rate': 'http_server::rate_public::tests::',
                'new_session': 'auth::session::http_bridge::rate_tests::',
                'old_public': 'http_server::response_public::tests::',
                'old_owner': 'http_server::request_headers::native_owner_tests::',
                'old_attachment': 'http_server::response_attachment::tests::',
                'old_send': 'http_server::response_send::',
            }
            for key, prefix in prefixes.items():
                if {name for name in library if name.startswith(prefix)} != set(GROUPS[key]):
                    raise ValueError('selected module inventory mismatch')
            if integration != set(GROUPS['session_normal']):
                raise ValueError('normal Session inventory mismatch')
            if not set(GROUPS['old_parts']).issubset(library) or not set(GROUPS['guarded']).issubset(integration):
                raise ValueError('exact selected case absent')


        def result(text, expected, code=0, full=False):
            if code != 0:
                raise ValueError('nonzero cargo is not success')
            starts = re.findall(r'^running (\d+) tests?$', text, re.M)
            cases = re.findall(r'^test (\S+) \.\.\. (ok|FAILED|ignored[^\n]*)$', text, re.M)
            totals = re.findall(r'^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out; finished in [^\n]+$', text, re.M)
            if starts != [str(len(expected))] or len(cases) != len(expected) or len({name for name, _ in cases}) != len(cases):
                raise ValueError('execution count mismatch')
            if {name for name, _ in cases} != set(expected) or any(status != 'ok' for _, status in cases):
                raise ValueError('missing/failed/ignored execution')
            if len(totals) != 1 or totals[0][:5] != ('ok', str(len(expected)), '0', '0', '0'):
                raise ValueError('result summary mismatch')
            if full and totals[0][5] != '0':
                raise ValueError('full suite filtered cases')


        STAGE_SOURCE = 'runtime/src/http_server/browser_login_stage_tests.rs'
        STAGE_LINES = 553
        STAGE_SHA = '220975a888800934f209be4ec4a96449e32f3cedef90119e517d6c01b2dcb3a3'
        STAGE_PHASES = frozenset(('uncaught_panic', 'timer_completion', 'pending_before_deadline',
                                 'response_status', 'managed_headers', 'owner_retired', 'sanitized_request',
                                 'consumed_deletion', 'auth_cookie', 'business_fault_entered'))
        STAGE_CAUSES = {
            'real issue failed before stage acknowledgement': 'issue_before_ack',
            'response escaped actual issue stage': 'issue_escaped',
            'native stage setup wall guard': 'issue_wall_guard',
            'unattached header fixture has no response Context': 'unattached_context',
        }


        def stage_failures(text):
            """Only independently FAILED known cases; no rejected text/path is rendered."""
            failed = set(re.findall(r'^test (\S+) \.\.\. FAILED$', text, re.M))
            projected = []
            for name in GROUPS['browser_stage']:
                if name not in failed:
                    continue
                starts = list(re.finditer(r'^---- ' + re.escape(name) + r' stdout ----$', text, re.M))
                facts = []
                if len(starts) == 1:
                    block = text[starts[0].end():]
                    boundary = re.search(r'^(?:---- .* stdout ----|failures:|successes:|test result:)', block, re.M)
                    if boundary:
                        block = block[:boundary.start()]
                    panics = re.finditer(r"^thread '" + re.escape(name) + r"'(?: \([0-9]{1,20}\))? panicked at ([^\r\n]+):([0-9]{1,7}):([0-9]{1,5}):\n([^\r\n]*)", block, re.M)
                    for panic in panics:
                        path, number, column, message = panic.groups()
                        # Caught business panics are expected by two fixtures. Their
                        # presence is neither a failed-case oracle nor a failure cause.
                        if message in ('owned stage verifier panic', 'owned stage handler panic'):
                            continue
                        phase_match = re.fullmatch(r'(?:assertion `left == right` failed: )?browser_stage_oracle phase=([a-z_]+)', message)
                        phase = phase_match[1] if phase_match and phase_match[1] in STAGE_PHASES else 'unavailable'
                        cause = STAGE_CAUSES.get(message, 'unavailable')
                        path = path.replace('\\', '/')
                        allowed = (path == STAGE_SOURCE or path == 'src/http_server/browser_login_stage_tests.rs'
                                   or path.endswith('/' + STAGE_SOURCE))
                        if allowed and 1 <= int(number) <= STAGE_LINES and 1 <= int(column) <= 4096:
                            facts.append(' source=browser_login_stage_tests line=' + str(int(number))
                                         + ' column=' + str(int(column)) + ' source_sha256=' + STAGE_SHA
                                         + ' phase=' + phase + ' cause=' + cause)
                        elif phase != 'unavailable' or cause != 'unavailable':
                            facts.append(' source=unavailable phase=' + phase + ' cause=' + cause)
                # Ambiguous/missing blocks/locations remain explicitly unavailable.
                fact = facts[0] if len(facts) == 1 else ' source=unavailable phase=unavailable cause=unavailable'
                projected.append('stage_failure case=' + name + fact)
            return projected


        SESSION_SOURCE = 'runtime/tests/session_csrf_public_api.rs'
        SESSION_SIZE = 43085
        SESSION_LINES = 1249
        SESSION_SHA = 'e6214e0267d6d8a713578c0c173c9ca18bfc11c910f34f51d4ce3a8875457467'


        def session_failures(text, expected):
            """Project only hash-bound positions for inventory-bound failed Session cases."""
            text = text.replace('\r\n', '\n')
            if SOURCES.get(SESSION_SOURCE) != (SESSION_SHA, SESSION_SIZE, SESSION_LINES):
                return ['session_failure case=' + name + ' source=unavailable'
                        for name in expected
                        if re.search(r'^test ' + re.escape(name) + r' \.\.\. FAILED$', text, re.M)]
            rows = re.findall(r'^test (\S+) \.\.\. (ok|FAILED|ignored[^\n]*)$', text, re.M)
            projected = []
            for name in expected:
                states = [status for test_name, status in rows if test_name == name]
                if 'FAILED' not in states:
                    continue
                if states != ['FAILED']:
                    projected.append('session_failure case=' + name + ' source=unavailable')
                    continue
                starts = list(re.finditer(r'^---- ' + re.escape(name) + r' stdout ----$', text, re.M))
                locations = []
                if len(starts) == 1:
                    block = text[starts[0].end():]
                    boundary = re.search(r'^(?:---- .* stdout ----|failures:|successes:|test result:)', block, re.M)
                    if boundary is not None:
                        block = block[:boundary.start()]
                        panic_pattern = (r"^thread '" + re.escape(name)
                                         + r"'(?: \([0-9]{1,20}\))? panicked at ([^\r\n]+):"
                                         + r"([0-9]{1,7}):([0-9]{1,5}):")
                        locations = list(re.finditer(panic_pattern, block, re.M))
                if len(locations) == 1:
                    match = locations[0]
                    path = match.group(1).replace('\\', '/')
                    allowed = (path == SESSION_SOURCE
                               or path == 'tests/session_csrf_public_api.rs'
                               or path.endswith('/' + SESSION_SOURCE))
                    line = int(match.group(2))
                    column = int(match.group(3))
                    if allowed and 1 <= line <= SESSION_LINES and 1 <= column <= 4096:
                        projected.append('session_failure case=' + name
                                         + ' source=session_csrf_public_api line=' + str(line)
                                         + ' column=' + str(column)
                                         + ' source_sha256=' + SESSION_SHA)
                        continue
                # Missing, ambiguous, unexpected, or out-of-range positions remain closed.
                projected.append('session_failure case=' + name + ' source=unavailable')
            return projected


        def session_projection(path):
            try:
                with Path(path).open('rb') as handle:
                    raw = handle.read(256*1024+1)
                if len(raw) > 256*1024:
                    print('session_failure_projection=unavailable')
                    return
                text = raw.decode('utf-8', errors='strict').replace('\r\n', '\n')
                facts = session_failures(text, GROUPS['session_full'])
                for fact in facts:
                    print(fact)
                print('session_failure_projection=bounded facts=' + str(len(facts)))
            except Exception:
                # This supplemental projection never replaces the existing collector or exit checks.
                print('session_failure_projection=unavailable')


        def selftest():
            case = GROUPS['new_rate'][0]
            good = 'running 1 test\ntest ' + case + ' ... ok\n\ntest result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 99 filtered out; finished in 0.00s\n'
            result(good, [case])
            library = [name for key in ('new_rate','new_session','old_public','old_owner','old_parts','old_attachment','old_send','browser_stage') for name in GROUPS[key]]
            def listed(names):
                return ''.join(name + ': test\n' for name in names) + '\n' + str(len(names)) + ' tests, 0 benchmarks\n'
            listing(listed(library), listed(GROUPS['session_normal']))
            cors_case = GROUPS['cors_probe'][0]
            exact_listing(listed([cors_case]), [cors_case])
            for invalid_listing in (listed([]), listed(['different_case']), listed([cors_case, cors_case])):
                try:
                    exact_listing(invalid_listing, [cors_case])
                except ValueError:
                    continue
                raise ValueError('invalid exact CORS listing accepted')
            cors_good = ('running 1 test\ntest ' + cors_case + ' ... ok\n\n'
                         + 'test result: ok. 1 passed; 0 failed; 0 ignored; 0 measured; 50 filtered out; finished in 0.01s\n')
            result(cors_good, [cors_case])
            for invalid_result in (cors_good.replace(' ... ok', ' ... ignored').replace('1 passed', '0 passed').replace('0 ignored', '1 ignored'),
                                   cors_good.replace('1 passed', '2 passed')):
                try:
                    result(invalid_result, [cors_case])
                except ValueError:
                    continue
                raise ValueError('invalid exact CORS result accepted')
            digest = hashlib.sha256(b'x\n').hexdigest()
            source_bytes(b'x\n', 2, 1, digest)
            source_bytes(b'x\r\n', 2, 1, digest)
            negative = [
                lambda: result(good, [case], 101),
                lambda: result(good.replace('running 1 test', 'running 0 tests').replace('1 passed', '0 passed'), [case]),
                lambda: result(good.replace(' ... ok', ' ... ignored').replace('1 passed', '0 passed').replace('0 ignored', '1 ignored'), [case]),
                lambda: result(good.replace(' ... ok', ' ... FAILED'), [case]),
                lambda: result(good.replace(case, 'wrong_case'), [case]),
                lambda: result(good.replace('1 passed', '2 passed'), [case]),
                lambda: result(good.replace('\n\ntest result:', '\ntest ' + case + ' ... ok\n\ntest result:'), [case]),
                lambda: listing(listed(library[1:]), listed(GROUPS['session_normal'])),
                lambda: listing(listed(library), listed([])),
                lambda: listing(listed(library + [case]), listed(GROUPS['session_normal'])),
                lambda: source_bytes(b'y\n', 2, 1, digest),
                lambda: source_bytes(b'x\r', 2, 1, digest),
                lambda: source_bytes(b'x\nxx', 2, 1, digest),
                lambda: source_bytes(b'\xff\n', 2, 1, digest),
            ]
            for reject in negative:
                try:
                    reject()
                except ValueError:
                    continue
                raise ValueError('negative control accepted')
            result(good.replace('99 filtered out', '0 filtered out'), [case], full=True)
            try:
                result(good, [case], full=True)
            except ValueError:
                pass
            else:
                raise ValueError('full suite filtering accepted')
            session_case = 'guarded_partial_body_preparation_uses_original_security_deadline'
            expected_projection = ['session_failure case=' + session_case
                                   + ' source=session_csrf_public_api line=1000 column=12 source_sha256=' + SESSION_SHA]
            def failure_block(path, line='1000', column='12', thread='', failed=True, duplicate=False, complete=True):
                row = 'test ' + session_case + ' ... FAILED\n' if failed else ''
                header = "thread '" + session_case + "'" + thread + ' panicked at ' + path + ':' + line + ':' + column + ':\n'
                body = 'private_panic_payload_must_not_escape\n'
                tail = ('\nfailures:\n    ' + session_case + '\n') if complete else ''
                return (row + '\nfailures:\n\n---- ' + session_case + ' stdout ----\n'
                        + header + body + (header + body if duplicate else '') + tail)
            valid_lf = failure_block('runtime/tests/session_csrf_public_api.rs')
            valid_crlf = failure_block(r'C:\agent\work\repo\runtime\tests\session_csrf_public_api.rs', thread=' (42)').replace('\n', '\r\n')
            assert session_failures(valid_lf, GROUPS['session_full']) == expected_projection
            assert session_failures(valid_crlf, GROUPS['session_full']) == expected_projection
            wrong_path = session_failures(failure_block('C:\\private\\other.rs'), GROUPS['session_full'])
            out_of_range = session_failures(failure_block('runtime/tests/session_csrf_public_api.rs', str(SESSION_LINES + 1)), GROUPS['session_full'])
            ambiguous = session_failures(failure_block('runtime/tests/session_csrf_public_api.rs', duplicate=True), GROUPS['session_full'])
            incomplete = session_failures(failure_block('runtime/tests/session_csrf_public_api.rs', complete=False), GROUPS['session_full'])
            expected_panic_only = session_failures(failure_block('runtime/tests/session_csrf_public_api.rs', failed=False), GROUPS['session_full'])
            unknown_case = session_failures('test unrelated_secret_case ... FAILED\nthread \'unrelated_secret_case\' panicked at private/secret.rs:2:3:\n', GROUPS['session_full'])
            assert len(wrong_path) == len(out_of_range) == len(ambiguous) == len(incomplete) == 1
            assert all(value.endswith('source=unavailable') for value in wrong_path + out_of_range + ambiguous + incomplete)
            assert expected_panic_only == [] and unknown_case == []
            with tempfile.TemporaryDirectory(prefix='sf07-session-projection-') as tempdir:
                raw_path = Path(tempdir) / 'synthetic-session.raw'
                raw_path.write_text(valid_crlf, encoding='utf-8', newline='')
                cli = subprocess.run([sys.executable, str(Path(__file__).resolve()),
                                      'session-projection', str(raw_path)],
                                     capture_output=True, text=True, timeout=10)
                assert cli.returncode == 0
                assert expected_projection[0] in cli.stdout
                assert 'session_failure_projection=bounded facts=1' in cli.stdout
                assert 'private_panic_payload_must_not_escape' not in cli.stdout
                assert 'private_panic_payload_must_not_escape' not in cli.stderr
            projected_text = '\n'.join(expected_projection + wrong_path + out_of_range + ambiguous + incomplete)
            assert 'private_panic_payload_must_not_escape' not in projected_text
            assert 'C:' not in projected_text and '/private/' not in projected_text and 'secret.rs' not in projected_text
            print('session_source_projection=LF_CRLF_and_thread_id_pass; bounded_CLI_invoked; wrong_path_range_duplicate_truncation_fail_closed; panic_only_no_case; raw_material_absent')
            print('synthetic_negative_controls=15 rejected; positive_shapes_and_LF_CRLF=passed; native_evidence=none')


        if __name__ == '__main__':
            try:
                mode = sys.argv[1]
                if mode == 'selftest':
                    selftest()
                elif mode == 'sources':
                    sources()
                elif mode == 'listing':
                    listing(Path(sys.argv[2]).read_text(encoding='utf-8'), Path(sys.argv[3]).read_text(encoding='utf-8'))
                    print('new=12 old=28 guarded=1 actual_collection=passed')
                elif mode == 'cors-listing':
                    exact_listing(Path(sys.argv[2]).read_text(encoding='utf-8'), GROUPS['cors_probe'])
                    print('cors_probe_collection=one_exact_case_present')
                elif mode == 'cors-probe':
                    code, capture = int(sys.argv[3]), int(sys.argv[4])
                    with Path(sys.argv[2]).open('rb') as handle:
                        raw = handle.read(256*1024+1)
                    if len(raw) > 256*1024:
                        raise ValueError('bounded CORS capture overflow')
                    text = raw.decode('utf-8', errors='strict').replace('\r\n', '\n')
                    case = GROUPS['cors_probe'][0]
                    print('cors_probe cargo_exit=' + str(code) + ' capture_exit=' + str(capture))
                    failed = re.findall(r'^test ' + re.escape(case) + r' \.\.\. FAILED$', text, re.M)
                    if failed == [case]:
                        print('cors_probe failed_case=' + case)
                    if capture != 0:
                        raise ValueError('bounded CORS capture failed')
                    result(text, GROUPS['cors_probe'], code)
                    print('cors_probe case=' + case + ' state=passed ignored=0')
                elif mode == 'session-projection':
                    session_projection(sys.argv[2])
                elif mode == 'full-listing':
                    if list_names(Path(sys.argv[2]).read_text(encoding='utf-8')) != set(GROUPS['session_full']) or list_names(Path(sys.argv[3]).read_text(encoding='utf-8')) != set(GROUPS['browser_full']):
                        raise ValueError('diagnostic full inventory mismatch')
                    print('diagnostic_collection=session11 browser10 passed')
                elif mode == 'result':
                    key = sys.argv[2]
                    code, capture = int(sys.argv[4]), int(sys.argv[5])
                    with Path(sys.argv[3]).open('rb') as handle:
                        raw = handle.read(256*1024+1)
                    if len(raw) > 256*1024:
                        raise ValueError('bounded capture overflow')
                    text = raw.decode('utf-8', errors='strict').replace('\r\n','\n')
                    print('group=' + key + ' cargo_exit=' + str(code) + ' capture_exit=' + str(capture))
                    for name in GROUPS[key]:
                        if re.search(r'^test ' + re.escape(name) + r' \.\.\. FAILED$', text, re.M):
                            print('group=' + key + ' failed_case=' + name)
                    if capture != 0:
                        raise ValueError('capture failure')
                    if key == 'browser_stage':
                        for fact in stage_failures(text):
                            print(fact)
                    if key in ('session_full', 'session_normal'):
                        for fact in session_failures(text, GROUPS[key]):
                            print(fact)
                    result(text, GROUPS[key], code)
                    print('group=' + key + ' executed=' + str(len(GROUPS[key])) + ' failed=0 ignored=0')
                else:
                    raise ValueError('invalid mode')
            except (ValueError, OSError, KeyError, IndexError):
                raise SystemExit('closed source/inventory/result guard failed')
        PY
        python "$RUNNER_TEMP/sf07-selected-guard.py" selftest
        python "$RUNNER_TEMP/sf07-selected-guard.py" sources
        if bash -c 'set -euo pipefail; false | cat'; then
          exit 1
        fi
    - name: Compile and collect existing opt-in diagnostic full targets
      env:
        RUSTFLAGS: --cfg nagi_auth_stage_diag --cfg nagi_browser_login_diag
      shell: bash
      run: |
        set -euo pipefail
        trap 'rm -f "$RUNNER_TEMP"/sf07-*.raw' EXIT
        python -B scripts/tests/test_session_deadline_diagnostic.py
        python -B scripts/tests/test_session_native_finish_diagnostic.py
        cargo test --locked -p nagi-runtime --test session_csrf_public_api --no-run
        cargo test --locked -p nagi-runtime --test browser_login_public_api --no-run
        cargo test --locked -p nagi-runtime --test cors_public_api --no-run
        cargo test --locked -p nagi-runtime --test session_csrf_public_api -- --list > "$RUNNER_TEMP/sf07-diag-session-list.raw"
        cargo test --locked -p nagi-runtime --test browser_login_public_api -- --list > "$RUNNER_TEMP/sf07-diag-browser-list.raw"
        cargo test --locked -p nagi-runtime --test cors_public_api actual_allow_deny_omit_and_head_record_selection_preserve_execution -- --exact --list > "$RUNNER_TEMP/sf07-diag-cors-list.raw"
        python "$RUNNER_TEMP/sf07-selected-guard.py" full-listing "$RUNNER_TEMP/sf07-diag-session-list.raw" "$RUNNER_TEMP/sf07-diag-browser-list.raw"
        python "$RUNNER_TEMP/sf07-selected-guard.py" cors-listing "$RUNNER_TEMP/sf07-diag-cors-list.raw"
    - name: Probe one CORS positive startup case once
      env:
        RUSTFLAGS: --cfg nagi_auth_stage_diag --cfg nagi_browser_login_diag
      shell: bash
      run: |
        set -euo pipefail
        trap 'rm -f "$RUNNER_TEMP/sf07-cors-probe.raw"' EXIT
        if cargo test --locked -p nagi-runtime --test cors_public_api actual_allow_deny_omit_and_head_record_selection_preserve_execution -- --exact 2>&1 | python -c 'import sys; remaining=256*1024+1
        while True:
         data=sys.stdin.buffer.read(8192)
         if not data: break
         if remaining:
          sys.stdout.buffer.write(data[:remaining]); remaining-=min(remaining,len(data))
        sys.stdout.buffer.flush()' > "$RUNNER_TEMP/sf07-cors-probe.raw"; then
          cors_status=("${PIPESTATUS[@]}")
        else
          cors_status=("${PIPESTATUS[@]}")
        fi
        python "$RUNNER_TEMP/sf07-selected-guard.py" cors-probe "$RUNNER_TEMP/sf07-cors-probe.raw" "${cors_status[0]}" "${cors_status[1]}"
        test "${cors_status[0]}" -eq 0
        test "${cors_status[1]}" -eq 0
    - name: Execute full Session and Browser suites once with bounded existing diagnostics
      env:
        RUSTFLAGS: --cfg nagi_auth_stage_diag --cfg nagi_browser_login_diag
      shell: bash
      run: |
        set -euo pipefail
        trap 'rm -f "$RUNNER_TEMP/session-deadline-session.raw" "$RUNNER_TEMP/session-deadline-browser.raw"' EXIT
        if cargo test --locked -p nagi-runtime --test session_csrf_public_api 2>&1 | python -c 'import sys; remaining=256*1024+1
        while True:
         data=sys.stdin.buffer.read(8192)
         if not data: break
         if remaining:
          sys.stdout.buffer.write(data[:remaining]); remaining-=min(remaining,len(data))
        sys.stdout.buffer.flush()' > "$RUNNER_TEMP/session-deadline-session.raw"; then
          session_status=("${PIPESTATUS[@]}")
        else
          session_status=("${PIPESTATUS[@]}")
        fi
        if cargo test --locked -p nagi-runtime --test browser_login_public_api 2>&1 | python -c 'import sys; remaining=256*1024+1
        while True:
         data=sys.stdin.buffer.read(8192)
         if not data: break
         if remaining:
          sys.stdout.buffer.write(data[:remaining]); remaining-=min(remaining,len(data))
        sys.stdout.buffer.flush()' > "$RUNNER_TEMP/session-deadline-browser.raw"; then
          browser_status=("${PIPESTATUS[@]}")
        else
          browser_status=("${PIPESTATUS[@]}")
        fi
        python "$RUNNER_TEMP/sf07-selected-guard.py" session-projection "$RUNNER_TEMP/session-deadline-session.raw"
        if python scripts/ci/session_deadline_diagnostic.py "$RUNNER_TEMP" "${session_status[0]}" "${browser_status[0]}" "$RUNNER_TEMP/session-deadline-diagnostic.json"; then
          collector_rc=0
        else
          collector_rc=$?
        fi
        printf 'session_cargo_exit=%s browser_cargo_exit=%s session_capture_exit=%s browser_capture_exit=%s collector_exit=%s\n' "${session_status[0]}" "${browser_status[0]}" "${session_status[1]}" "${browser_status[1]}" "$collector_rc"
        python - <<'PY'
        import json, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import session_deadline_diagnostic as diagnostic
        path = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'session-deadline-diagnostic.json'
        with path.open('rb') as stream:
            raw = stream.read(diagnostic.OUTPUT_LIMIT + 1)
        if len(raw) > diagnostic.OUTPUT_LIMIT:
            raise SystemExit('session_closed_record unavailable')
        record = json.loads(raw)
        if not diagnostic._closed_record_shape(record, False):
            raise SystemExit('session_closed_record unavailable')
        print('session_closed_record=' + json.dumps(record, sort_keys=True, separators=(',', ':')))
        PY
        test "${session_status[0]}" -eq 0
        test "${browser_status[0]}" -eq 0
        test "${session_status[1]}" -eq 0
        test "${browser_status[1]}" -eq 0
        test "$collector_rc" -eq 0
    - name: Preserve closed diagnostic result only
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sf07-session-browser-${{ runner.os }}
        path: ${{ runner.temp }}/session-deadline-diagnostic.json
        if-no-files-found: ignore
